                    cpu: 500m
                    memory: 512Mi
                  requests:
                    cpu: 10m
                    memory: 256Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
              nodeSelector:
                kubernetes.io/arch: amd64
              securityContext:
                runAsNonRoot: true
              serviceAccountName: mas-iam-operator-controller-manager
              terminationGracePeriodSeconds: 10
