{{- $openldap := .Values.openldap -}}
{{- $seedEnabled := gt (len $openldap.seedLDIFs) 0 -}}
{{- if and $openldap.enabled $seedEnabled $openldap.userPasswords -}}
{{- $passwords := $openldap.userPasswords -}}
{{- if $passwords.createSecret }}
  {{- fail "openldap.userPasswords.createSecret is no longer supported; create the secret yourself and set openldap.userPasswords.secretName" -}}
{{- end -}}
{{- if not $passwords.secretName }}
  {{- fail "openldap.userPasswords.secretName must be set when seed LDIFs are enabled" -}}
{{- end -}}
{{- end }}
