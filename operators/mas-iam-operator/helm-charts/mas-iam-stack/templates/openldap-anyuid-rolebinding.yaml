{{- /*
  Always grant the anyuid SCC to the openldap ServiceAccount on OCP.

  The bitnami-style OpenLDAP image needs uid 1001 (the bundled `slapd` user).
  OpenShift's restricted-v2 SCC enforces UIDs in the project's allocated range
  (typically 1000850000-1000859999), so uid 1001 is REJECTED even if the chart
  values set `containerSecurityContext.enabled=true` and `runAsNonRoot=true`.
  The previous "skip anyuid when runAsNonRoot is set" heuristic surfaced as a
  `ReplicaFailure: FailedCreate ... must be in the ranges` error on first
  deploy with the new v0.0.12 chart values. Always create the binding when
  openldap is enabled on an OCP cluster; matches the pattern used by
  keycloak-anyuid-rolebinding.yaml.
*/ -}}
{{- if and .Values.openldap.enabled (has "security.openshift.io/v1/SecurityContextConstraints" .Capabilities.APIVersions) -}}
{{- $saName := default (printf "%s-openldap" (include "mas-iam-stack.fullname" .)) .Values.openldap.serviceAccount.name -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mas-iam-stack.fullname" . }}-openldap-anyuid
  labels:
    {{- include "mas-iam-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: openldap
  annotations:
    security.openshift.io/scc: anyuid
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
{{- end }}
