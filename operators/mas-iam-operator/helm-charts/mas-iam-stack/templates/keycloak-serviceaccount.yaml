{{- /*
Always rendered when create is true. An earlier version skipped it when a
cluster `lookup` found the SA, which made a real `helm upgrade` drop the SA
from the release manifest (and delete it), then recreate it on the next one.
*/ -}}
{{- $sa := .Values.keycloak.serviceAccount | default dict -}}
{{- $create := true -}}
{{- if hasKey $sa "create" -}}
{{- $create = $sa.create -}}
{{- end -}}
{{- if and $create (ne (toString .Values.keycloak.enabled) "false") -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mas-iam-stack.keycloakServiceAccountName" . | trim }}
  labels:
    {{- include "mas-iam-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
{{- end }}
