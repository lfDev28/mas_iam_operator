# Generated from helm-charts/mas-iam-stack/values.yaml plus the secret names the
# mas-est installer creates. Only the chart's own values are listed: PostgreSQL
# subchart settings not shown here use the Bitnami defaults (metrics and
# volumePermissions stay off; their docker.io/bitnami images no longer exist).
apiVersion: iam.mas.ibm.com/v1alpha1
kind: MasIamStack
metadata:
  name: mas-est-iam
spec:
  keycloak:
    enabled: true
    devMode:
      enabled: false
    image:
      registry: quay.io
      repository: keycloak/keycloak
      tag: 26.0.5
      pullPolicy: IfNotPresent
      pullSecret: ''
    args:
    - start
    replicaCount: 1
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 2Gi
    containerSecurityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
    startupProbeFailureThreshold: 60
    env:
    - name: KC_HEALTH_ENABLED
      value: 'true'
    - name: KC_HTTP_ENABLED
      value: 'true'
    - name: KC_HOSTNAME_STRICT
      value: 'false'
    - name: KC_PROXY_HEADERS
      value: xforwarded
    scim:
      enabled: false
      authenticationMode: KEYCLOAK
      externalIssuer: ''
      externalAudience: ''
      externalJwksUri: ''
      linkIdentityProvider: false
      emailAsUsername: false
    bootstrapAdmin:
      createSecret: false
      secretName: mas-est-iam-bootstrap-admin
      usernameKey: username
      passwordKey: password
      username: admin
      password: ''
    route:
      enabled: true
      host: ''
      autoHost:
        enabled: false
        appsDomain: ''
      tls:
        termination: edge
        insecurePolicy: Redirect
        certificate: ''
        key: ''
        caCertificate: ''
        destinationCACertificate: ''
    service:
      port: 8080
    realmImport:
      enabled: true
      overrideExisting: false
      files:
      - file: realm-config/maximo-realm.json
        target: maximo-realm.json
    serviceAccount:
      create: true
      name: ''
    ldap:
      autoConfigure: true
      realm: maximo
      providerName: openldap
      connectionUrl: ''
      baseDn: dc=demo,dc=local
      bindDn: cn=admin,dc=demo,dc=local
      bindCredentialSecret: mas-est-iam-openldap-admin
      autoConfigureOnUpgrade: false
      bindCredentialKey: password
      usersDn: ou=users,dc=demo,dc=local
      groupsDn: ou=groups,dc=demo,dc=local
      useTruststoreSpi: Always
      truststoreSecret: ''
      truststoreKey: truststore.jks
      truststorePasswordSecret: ''
      truststorePasswordKey: password
      tls:
        enabled: true
        caSecret: mas-est-iam-keycloak-openldap-tls
        caBundleKey: ca.crt
        truststorePassword: changeit
        truststoreFile: ldap-truststore.p12
        hostnameVerificationPolicy: ANY
      editMode: READ_ONLY
      importUsers: true
      syncPeriod: 3600
      fullSyncPeriod: 86400
      changedSyncPeriod: 600
      cachePolicy: DEFAULT
      searchScope: SUBTREE
      uuidLDAPAttribute: entryUUID
      usernameLDAPAttribute: uid
      rdnLDAPAttribute: uid
      configJobWaitTimeoutSeconds: 900
      configJobActiveDeadlineSeconds: 1800
  postgresql:
    enabled: true
    image:
      registry: quay.io
      repository: lee_forster/mas-iam-operator
      tag: postgresql-17.6.0-debian-12-r4-multi
      pullPolicy: IfNotPresent
    auth:
      existingSecret: mas-est-iam-postgresql
      username: keycloak
      database: keycloak
      secretKeys:
        adminPasswordKey: postgres-password
        userPasswordKey: password
      password: unused-see-existingSecret
    primary:
      persistence:
        enabled: true
        storageClass: rook-ceph-block
        size: 8Gi
      podSecurityContext:
        enabled: true
        fsGroup: 1001
      containerSecurityContext:
        enabled: true
        runAsUser: 1001
        runAsNonRoot: true
      resourcesPreset: none
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: '1'
          memory: 512Mi
  openldap:
    enabled: true
    image:
      repository: quay.io/lee_forster/mas-iam-operator
      tag: openldap-1.5.0-multi
      pullPolicy: IfNotPresent
    replicaCount: 1
    admin:
      createSecret: false
      secretName: mas-est-iam-openldap-admin
      passwordKey: password
      password: ''
      configPassword: ''
      configPasswordKey: configPassword
    service:
      port: 389
      tlsPort: 636
      type: ClusterIP
    persistence:
      enabled: true
      size: 2Gi
      storageClass: ''
    probes:
      enabled: true
      startupFailureThreshold: 60
    config:
      organisation: Demo Org
      domain: demo.local
      baseDN: dc=demo,dc=local
      enableConfigAdmin: false
    podSecurityContext:
      enabled: true
      fsGroup: 0
    containerSecurityContext:
      enabled: false
      runAsNonRoot: false
      runAsUser: 0
    userPasswords:
      createSecret: false
      secretName: mas-est-iam-openldap-user-passwords
      data: {}
    podAnnotations: {}
    podLabels: {}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    nodeSelector: {}
    tolerations: []
    affinity: {}
    serviceAccount:
      create: true
      name: ''
    seedLDIFs:
    - file: ldap-seed/dev-base.ldif
    tls:
      enabled: true
      createSecret: false
      secretName: mas-est-iam-keycloak-openldap-tls
      certKey: tls.crt
      privateKeyKey: tls.key
      caKey: ca.crt
      truststoreKey: ldap-truststore.p12
      truststorePasswordKey: truststorePassword
      enforce: false
    extraEnv:
    - name: CONTAINER_LOG_LEVEL
      value: '4'
    - name: LDAP_LOGLEVEL
      value: '256'
    - name: LDAP_TLS_VERIFY_CLIENT
      value: never
