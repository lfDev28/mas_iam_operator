apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
##
## Cluster-scoped rules only. Everything the chart renders lives in the
## watched namespace and is granted by manager_namespaced_role.yaml, which
## becomes the CSV's namespaced `permissions`.
##
# We need to get namespaces so the operator can read namespaces to ensure they exist
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
# SecurityContextConstraints are cluster-scoped. Holding `use` lets the
# operator create the chart's RoleBindings to system:openshift:scc:anyuid.
- apiGroups:
  - "security.openshift.io"
  resources:
  - "securitycontextconstraints"
  verbs:
  - use
  - get
  - list
  - watch

#+kubebuilder:scaffold:rules
