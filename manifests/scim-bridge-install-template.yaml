apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: scim-bridge-install
  annotations:
    description: "Install the SCIM bridge with a demo MAS profile bootstrap."
parameters:
  - name: SCIM_BRIDGE_NAMESPACE
    value: mas-est
  - name: SCIM_BRIDGE_IMAGE
    value: quay.io/lee_forster/mas-iam-scim-bridge:scim-bridge-v0.1.1
  - name: SCIM_BRIDGE_KEYCLOAK_IMAGE
    value: quay.io/lee_forster/mas-iam-keycloak:scim-bridge-v0.1.1
  - name: SCIM_BRIDGE_KEYCLOAK_BASE_URL
    value: http://mas-est-iam:8080
  - name: SCIM_BRIDGE_KEYCLOAK_REALM
    value: maximo
  - name: SCIM_BRIDGE_KEYCLOAK_CLIENT_ID
    value: scim-admin
  - name: SCIM_BRIDGE_KEYCLOAK_CLIENT_SECRET
    value: maxadmin
  - name: SCIM_BRIDGE_KEYCLOAK_RELEASE
    value: mas-est-iam
  - name: SCIM_BRIDGE_KEYCLOAK_NAMESPACE
    value: mas-est
  - name: SCIM_BRIDGE_KEYCLOAK_SERVICE
    value: mas-est-iam
  - name: SCIM_BRIDGE_KEYCLOAK_ASSIGN_MANAGED_ROLE
    value: "false"
  - name: SCIM_BRIDGE_MAS_BASE_URL
    required: true
  - name: SCIM_BRIDGE_MAS_API_TOKEN_NAME
    required: true
  - name: SCIM_BRIDGE_MAS_API_TOKEN_VALUE
    required: true
  - name: SCIM_BRIDGE_MAS_PROFILE_ID
    value: demo
  - name: SCIM_BRIDGE_MAS_PROFILE_MAP
    value: ""
  - name: SCIM_BRIDGE_MAS_PROFILE_MAP_JSON
    value: ""
  - name: SCIM_BRIDGE_MAS_PROFILE_REQUIRE_LABEL
    value: "false"
  - name: SCIM_BRIDGE_MAS_AUTH_TYPE
    value: jwt
  - name: SCIM_BRIDGE_MAS_INSECURE_SKIP_VERIFY
    value: "false"
  - name: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_ENABLED
    value: "true"
  - name: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_ID
    value: demo
  - name: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_WORKSPACE_ID
    required: true
  - name: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_JSON
    value: ""
  - name: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_JOB_NAME
    value: scim-bridge-mas-profile-bootstrap
  - name: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_IMAGE
    value: quay.io/curl/curl:8.5.0
  - name: SCIM_BRIDGE_BRIDGE_MODE
    value: poll
  - name: SCIM_BRIDGE_BRIDGE_POLL_INTERVAL
    value: 5m
  - name: SCIM_BRIDGE_BRIDGE_STATE_BACKEND
    value: filesystem
  - name: SCIM_BRIDGE_BRIDGE_STATE_PATH
    value: /var/lib/scim-bridge/state.json
  - name: SCIM_BRIDGE_BRIDGE_ALLOW_UPDATES
    value: "true"
  - name: SCIM_BRIDGE_BRIDGE_DRY_RUN
    value: "false"
  - name: SCIM_BRIDGE_BRIDGE_LOG_LEVEL
    value: info
  - name: SCIM_BRIDGE_BRIDGE_PAYLOAD_LOGGING
    value: "false"
  - name: SCIM_BRIDGE_INCLUDE_USERNAMES
    value: ""
  - name: SCIM_BRIDGE_INCLUDE_USERNAME_PREFIX
    value: ""
  - name: SCIM_BRIDGE_KEYCLOAK_CA_FILE
    value: ""
  - name: SCIM_BRIDGE_KEYCLOAK_INSECURE_SKIP_VERIFY
    value: "false"
  - name: SCIM_BRIDGE_MAS_CA_FILE
    value: ""
  - name: SCIM_BRIDGE_MAS_CA_BUNDLE
    value: ""
objects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: scim-bridge-config
      namespace: ${SCIM_BRIDGE_NAMESPACE}
    data:
      SCIM_BRIDGE_KEYCLOAK_BASE_URL: "${SCIM_BRIDGE_KEYCLOAK_BASE_URL}"
      SCIM_BRIDGE_KEYCLOAK_REALM: "${SCIM_BRIDGE_KEYCLOAK_REALM}"
      SCIM_BRIDGE_KEYCLOAK_CA_FILE: "${SCIM_BRIDGE_KEYCLOAK_CA_FILE}"
      SCIM_BRIDGE_KEYCLOAK_INSECURE_SKIP_VERIFY: "${SCIM_BRIDGE_KEYCLOAK_INSECURE_SKIP_VERIFY}"
      SCIM_BRIDGE_MAS_BASE_URL: "${SCIM_BRIDGE_MAS_BASE_URL}"
      SCIM_BRIDGE_MAS_PROFILE_ID: "${SCIM_BRIDGE_MAS_PROFILE_ID}"
      SCIM_BRIDGE_MAS_PROFILE_MAP: "${SCIM_BRIDGE_MAS_PROFILE_MAP}"
      SCIM_BRIDGE_MAS_PROFILE_MAP_JSON: "${SCIM_BRIDGE_MAS_PROFILE_MAP_JSON}"
      SCIM_BRIDGE_MAS_PROFILE_REQUIRE_LABEL: "${SCIM_BRIDGE_MAS_PROFILE_REQUIRE_LABEL}"
      SCIM_BRIDGE_MAS_AUTH_TYPE: "${SCIM_BRIDGE_MAS_AUTH_TYPE}"
      SCIM_BRIDGE_MAS_CA_FILE: "${SCIM_BRIDGE_MAS_CA_FILE}"
      SCIM_BRIDGE_MAS_INSECURE_SKIP_VERIFY: "${SCIM_BRIDGE_MAS_INSECURE_SKIP_VERIFY}"
      SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_ENABLED: "${SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_ENABLED}"
      SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_ID: "${SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_ID}"
      SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_WORKSPACE_ID: "${SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_WORKSPACE_ID}"
      SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_JSON: "${SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_JSON}"
      SCIM_BRIDGE_BRIDGE_MODE: "${SCIM_BRIDGE_BRIDGE_MODE}"
      SCIM_BRIDGE_BRIDGE_POLL_INTERVAL: "${SCIM_BRIDGE_BRIDGE_POLL_INTERVAL}"
      SCIM_BRIDGE_BRIDGE_STATE_BACKEND: "${SCIM_BRIDGE_BRIDGE_STATE_BACKEND}"
      SCIM_BRIDGE_BRIDGE_STATE_PATH: "${SCIM_BRIDGE_BRIDGE_STATE_PATH}"
      SCIM_BRIDGE_BRIDGE_ALLOW_UPDATES: "${SCIM_BRIDGE_BRIDGE_ALLOW_UPDATES}"
      SCIM_BRIDGE_BRIDGE_DRY_RUN: "${SCIM_BRIDGE_BRIDGE_DRY_RUN}"
      SCIM_BRIDGE_BRIDGE_LOG_LEVEL: "${SCIM_BRIDGE_BRIDGE_LOG_LEVEL}"
      SCIM_BRIDGE_BRIDGE_PAYLOAD_LOGGING: "${SCIM_BRIDGE_BRIDGE_PAYLOAD_LOGGING}"
      SCIM_BRIDGE_INCLUDE_USERNAMES: "${SCIM_BRIDGE_INCLUDE_USERNAMES}"
      SCIM_BRIDGE_INCLUDE_USERNAME_PREFIX: "${SCIM_BRIDGE_INCLUDE_USERNAME_PREFIX}"
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: scim-bridge-mas-ca
      namespace: ${SCIM_BRIDGE_NAMESPACE}
    data:
      mas-ca.crt: "${SCIM_BRIDGE_MAS_CA_BUNDLE}"
  - apiVersion: v1
    kind: Secret
    metadata:
      name: scim-bridge-secret
      namespace: ${SCIM_BRIDGE_NAMESPACE}
    type: Opaque
    stringData:
      SCIM_BRIDGE_KEYCLOAK_CLIENT_ID: "${SCIM_BRIDGE_KEYCLOAK_CLIENT_ID}"
      SCIM_BRIDGE_KEYCLOAK_CLIENT_SECRET: "${SCIM_BRIDGE_KEYCLOAK_CLIENT_SECRET}"
      SCIM_BRIDGE_MAS_TOKEN: ""
      SCIM_BRIDGE_MAS_API_TOKEN_NAME: "${SCIM_BRIDGE_MAS_API_TOKEN_NAME}"
      SCIM_BRIDGE_MAS_API_TOKEN_VALUE: "${SCIM_BRIDGE_MAS_API_TOKEN_VALUE}"
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: scim-bridge-state
      namespace: ${SCIM_BRIDGE_NAMESPACE}
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: scim-bridge
      namespace: ${SCIM_BRIDGE_NAMESPACE}
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: scim-bridge
      template:
        metadata:
          labels:
            app: scim-bridge
        spec:
          securityContext:
            runAsNonRoot: true
${SCIM_BRIDGE_POD_SECURITY_CONTEXT_EXTRA}
          containers:
            - name: scim-bridge
              image: "${SCIM_BRIDGE_IMAGE}"
              imagePullPolicy: Always
              args:
                - "--bridge-mode=${SCIM_BRIDGE_BRIDGE_MODE}"
                - "--bridge-state-backend=${SCIM_BRIDGE_BRIDGE_STATE_BACKEND}"
                - "--bridge-state-path=${SCIM_BRIDGE_BRIDGE_STATE_PATH}"
                - "--bridge-poll-interval=${SCIM_BRIDGE_BRIDGE_POLL_INTERVAL}"
                - "--bridge-allow-updates=${SCIM_BRIDGE_BRIDGE_ALLOW_UPDATES}"
                - "--bridge-dry-run=${SCIM_BRIDGE_BRIDGE_DRY_RUN}"
                - "--bridge-log-level=${SCIM_BRIDGE_BRIDGE_LOG_LEVEL}"
                - "--bridge-payload-logging=${SCIM_BRIDGE_BRIDGE_PAYLOAD_LOGGING}"
              env:
                - name: SSL_CERT_FILE
                  value: /etc/scim-bridge/certs/ca-bundle.crt
                - name: SSL_CERT_DIR
                  value: /etc/scim-bridge/certs
              envFrom:
                - configMapRef:
                    name: scim-bridge-config
                - secretRef:
                    name: scim-bridge-secret
              volumeMounts:
                - name: state
                  mountPath: /var/lib/scim-bridge
                - name: ca-certs
                  mountPath: /etc/scim-bridge/certs
                  readOnly: true
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: scim-bridge-state
            - name: ca-certs
              projected:
                sources:
                  - secret:
                      name: scim-bridge-ca
                      optional: true
                  - configMap:
                      name: scim-bridge-mas-ca
                      optional: true
                  - configMap:
                      name: scim-bridge-ca
                      optional: true
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: scim-bridge-keycloak-bootstrap
      namespace: ${SCIM_BRIDGE_KEYCLOAK_NAMESPACE}
      labels:
        app.kubernetes.io/name: scim-bridge
        app.kubernetes.io/component: keycloak-bootstrap
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: scim-bridge
            app.kubernetes.io/component: keycloak-bootstrap
        spec:
          restartPolicy: OnFailure
          containers:
            - name: keycloak-bootstrap
              image: "${SCIM_BRIDGE_KEYCLOAK_IMAGE}"
              imagePullPolicy: IfNotPresent
              env:
                - name: HOME
                  value: /tmp/kcadm
                - name: KC_HOST
                  value: "http://${SCIM_BRIDGE_KEYCLOAK_SERVICE}:8080"
                - name: SCIM_REALM
                  value: "${SCIM_BRIDGE_KEYCLOAK_REALM}"
                - name: SCIM_CLIENT_ID
                  value: "${SCIM_BRIDGE_KEYCLOAK_CLIENT_ID}"
                - name: SCIM_ASSIGN_MANAGED_ROLE
                  value: "${SCIM_BRIDGE_KEYCLOAK_ASSIGN_MANAGED_ROLE}"
                - name: KC_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: "${SCIM_BRIDGE_KEYCLOAK_RELEASE}-bootstrap-admin"
                      key: username
                - name: KC_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: "${SCIM_BRIDGE_KEYCLOAK_RELEASE}-bootstrap-admin"
                      key: password
                - name: SCIM_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: scim-bridge-secret
                      key: SCIM_BRIDGE_KEYCLOAK_CLIENT_SECRET
              command:
                - /bin/bash
                - -ec
                - |
                  set -euo pipefail
                  mkdir -p "${HOME}/.keycloak"
                  if [[ -z "${SCIM_CLIENT_SECRET}" ]]; then
                    echo "error: SCIM_CLIENT_SECRET is empty; populate scim-bridge-secret.SCIM_BRIDGE_KEYCLOAK_CLIENT_SECRET" >&2
                    exit 1
                  fi
                  host_port="${KC_HOST#*://}"
                  if [[ "$host_port" == "$KC_HOST" ]]; then
                    host_port="$KC_HOST"
                  fi
                  host_port="${host_port%%/*}"
                  host="${host_port%%:*}"
                  port="${host_port##*:}"
                  if [[ "$port" == "$host_port" ]]; then
                    port="8080"
                  fi
                  echo "Waiting for Keycloak service ${host}:${port}..."
                  until (echo >"/dev/tcp/${host}/${port}") >/dev/null 2>&1; do
                    sleep 5
                  done
                  echo "Waiting for Keycloak admin API..."
                  until /opt/keycloak/bin/kcadm.sh config credentials \
                    --server "$KC_HOST" \
                    --realm master \
                    --user "$KC_ADMIN_USER" \
                    --password "$KC_ADMIN_PASSWORD" >/dev/null 2>&1; do
                    sleep 5
                  done
                  for role in scim-access scim-managed; do
                    /opt/keycloak/bin/kcadm.sh create roles -r "${SCIM_REALM}" -s "name=${role}" >/dev/null 2>&1 || true
                  done
                  client_uuid="$(
                    /opt/keycloak/bin/kcadm.sh get clients -r "${SCIM_REALM}" --fields clientId,id --format csv --noquotes 2>/dev/null \
                      | tr -d '\r' \
                      | { grep -F "${SCIM_CLIENT_ID}," || true; } \
                      | cut -d, -f2 \
                      | head -n1
                  )"
                  if [[ -z "${client_uuid}" ]]; then
                    /opt/keycloak/bin/kcadm.sh create clients -r "${SCIM_REALM}" \
                      -s "clientId=${SCIM_CLIENT_ID}" \
                      -s enabled=true \
                      -s protocol=openid-connect \
                      -s serviceAccountsEnabled=true \
                      -s publicClient=false \
                      -s standardFlowEnabled=false \
                      -s directAccessGrantsEnabled=false \
                      -s "secret=${SCIM_CLIENT_SECRET}" >/dev/null
                    client_uuid="$(
                      /opt/keycloak/bin/kcadm.sh get clients -r "${SCIM_REALM}" --fields clientId,id --format csv --noquotes 2>/dev/null \
                        | tr -d '\r' \
                        | { grep -F "${SCIM_CLIENT_ID}," || true; } \
                        | cut -d, -f2 \
                        | head -n1
                    )"
                  else
                    /opt/keycloak/bin/kcadm.sh update "clients/${client_uuid}" -r "${SCIM_REALM}" \
                      -s enabled=true \
                      -s protocol=openid-connect \
                      -s serviceAccountsEnabled=true \
                      -s publicClient=false \
                      -s standardFlowEnabled=false \
                      -s directAccessGrantsEnabled=false \
                      -s "secret=${SCIM_CLIENT_SECRET}" >/dev/null
                  fi
                  if [[ -z "${client_uuid}" ]]; then
                    echo "error: failed to resolve Keycloak client UUID after create/update" >&2
                    exit 1
                  fi
                  sa_id=""
                  for _ in {1..30}; do
                    sa_id="$(
                      /opt/keycloak/bin/kcadm.sh get users -r "${SCIM_REALM}" -q "username=service-account-${SCIM_CLIENT_ID}" \
                        --fields id --format csv --noquotes 2>/dev/null \
                        | tr -d '\\r' \
                        | head -n1
                    )"
                    [[ -n "$sa_id" ]] && break
                    sleep 2
                  done
                  if [[ -z "${sa_id}" ]]; then
                    echo "error: failed to resolve service account user ID for ${SCIM_CLIENT_ID}" >&2
                    /opt/keycloak/bin/kcadm.sh get users -r "${SCIM_REALM}" -q "username=service-account-${SCIM_CLIENT_ID}" || true
                    exit 1
                  fi
                  /opt/keycloak/bin/kcadm.sh add-roles -r "${SCIM_REALM}" \
                    --uid "${sa_id}" \
                    --rolename scim-access >/dev/null 2>&1 || true
                  if [[ "${SCIM_ASSIGN_MANAGED_ROLE}" == "true" ]]; then
                    /opt/keycloak/bin/kcadm.sh add-roles -r "${SCIM_REALM}" \
                      --uid "${sa_id}" \
                      --rolename scim-managed >/dev/null 2>&1 || true
                  fi
                  for role in view-users query-users query-groups; do
                    /opt/keycloak/bin/kcadm.sh add-roles -r "${SCIM_REALM}" \
                      --uid "${sa_id}" \
                      --cclientid realm-management \
                      --rolename "${role}" >/dev/null 2>&1 || true
                  done
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: ${SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_JOB_NAME}
      namespace: ${SCIM_BRIDGE_NAMESPACE}
      labels:
        app.kubernetes.io/name: scim-bridge
        app.kubernetes.io/component: mas-profile-bootstrap
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: scim-bridge
            app.kubernetes.io/component: mas-profile-bootstrap
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mas-profile-bootstrap
              image: "${SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_IMAGE}"
              imagePullPolicy: IfNotPresent
              env:
                - name: MAS_PROFILE_BOOTSTRAP_ENABLED
                  valueFrom:
                    configMapKeyRef:
                      name: scim-bridge-config
                      key: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_ENABLED
                - name: MAS_BASE_URL
                  valueFrom:
                    configMapKeyRef:
                      name: scim-bridge-config
                      key: SCIM_BRIDGE_MAS_BASE_URL
                - name: MAS_PROFILE_ID
                  valueFrom:
                    configMapKeyRef:
                      name: scim-bridge-config
                      key: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_ID
                - name: MAS_WORKSPACE_ID
                  valueFrom:
                    configMapKeyRef:
                      name: scim-bridge-config
                      key: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_WORKSPACE_ID
                - name: MAS_PROFILE_BOOTSTRAP_JSON
                  valueFrom:
                    configMapKeyRef:
                      name: scim-bridge-config
                      key: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_JSON
                - name: MAS_INSECURE_SKIP_VERIFY
                  valueFrom:
                    configMapKeyRef:
                      name: scim-bridge-config
                      key: SCIM_BRIDGE_MAS_INSECURE_SKIP_VERIFY
                - name: MAS_CA_FILE
                  valueFrom:
                    configMapKeyRef:
                      name: scim-bridge-config
                      key: SCIM_BRIDGE_MAS_CA_FILE
                - name: MAS_AUTH_TYPE
                  valueFrom:
                    configMapKeyRef:
                      name: scim-bridge-config
                      key: SCIM_BRIDGE_MAS_AUTH_TYPE
                - name: MAS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: scim-bridge-secret
                      key: SCIM_BRIDGE_MAS_TOKEN
                - name: MAS_API_TOKEN_NAME
                  valueFrom:
                    secretKeyRef:
                      name: scim-bridge-secret
                      key: SCIM_BRIDGE_MAS_API_TOKEN_NAME
                - name: MAS_API_TOKEN_VALUE
                  valueFrom:
                    secretKeyRef:
                      name: scim-bridge-secret
                      key: SCIM_BRIDGE_MAS_API_TOKEN_VALUE
              volumeMounts:
                - name: ca-certs
                  mountPath: /etc/scim-bridge/certs
                  readOnly: true
              command:
                - /bin/sh
                - -ec
                - |
                  set -eu
                  if [ "${MAS_PROFILE_BOOTSTRAP_ENABLED:-false}" != "true" ]; then
                    echo "MAS profile bootstrap disabled; skipping."
                    exit 0
                  fi
                  if [ -z "${MAS_BASE_URL:-}" ]; then
                    echo "error: MAS_BASE_URL is required" >&2
                    exit 1
                  fi
                  case "${MAS_BASE_URL}" in
                    http://http://*|https://https://*|http://https://*|https://http://*)
                      echo "error: MAS_BASE_URL is malformed (${MAS_BASE_URL})" >&2
                      exit 1
                      ;;
                  esac
                  profile_id="${MAS_PROFILE_ID:-}"
                  if [ -z "${profile_id}" ]; then
                    echo "error: MAS_PROFILE_ID is required" >&2
                    exit 1
                  fi
                  base="${MAS_BASE_URL%/}"
                  auth_root="${base%/scim/v2}"
                  auth_url="${auth_root}/v1/authenticate"
                  profiles_url="${base}/Profiles"
                  profile_url="${profiles_url}/${profile_id}"
                  curl_args="-sS"
                  if [ "${MAS_INSECURE_SKIP_VERIFY:-false}" = "true" ]; then
                    curl_args="${curl_args} -k"
                  fi
                  if [ -n "${MAS_CA_FILE:-}" ]; then
                    curl_args="${curl_args} --cacert ${MAS_CA_FILE}"
                  fi
                  token="${MAS_TOKEN:-}"
                  auth_type="${MAS_AUTH_TYPE:-jwt}"
                  if [ -z "${token}" ]; then
                    if [ -z "${MAS_API_TOKEN_NAME:-}" ] || [ -z "${MAS_API_TOKEN_VALUE:-}" ]; then
                      echo "error: set MAS_TOKEN or MAS_API_TOKEN_NAME/VALUE" >&2
                      exit 1
                    fi
                    resp="$(curl ${curl_args} -u "${MAS_API_TOKEN_NAME}:${MAS_API_TOKEN_VALUE}" "${auth_url}")"
                    token="$(printf '%s' "${resp}" | tr -d '\r\n' | sed 's/.*\"token\"[[:space:]]*:[[:space:]]*\"//; s/\".*//')"
                    case "${token}" in
                      *.*.*) ;;
                      *)
                        echo "error: failed to parse token from MAS auth response" >&2
                        echo "response length: ${#resp}" >&2
                        exit 1
                        ;;
                    esac
                    auth_type="jwt"
                  fi
                  auth_header="Authorization: Bearer ${token}"
                  if [ "${auth_type}" = "api-key" ]; then
                    auth_header="Authorization: APIKey ${token}"
                  fi
                  payload="${MAS_PROFILE_BOOTSTRAP_JSON:-}"
                  if [ -z "${payload}" ]; then
                    workspace_id="${MAS_WORKSPACE_ID:-}"
                    if [ -z "${workspace_id}" ]; then
                      echo "error: MAS_WORKSPACE_ID is required when no JSON payload is provided" >&2
                      exit 1
                    fi
                    payload="$(printf '{"id":"%s","version":1,"identities":[{"type":"local"}],"entitlement":{"application":"PREMIUM","admin":"ADMIN_PREMIUM"},"workspaces":[{"id":"%s","applications":["manage"]}]}' "${profile_id}" "${workspace_id}")"
                  fi
                  echo "Checking for existing MAS profile ${profile_id}..."
                  status="$(curl ${curl_args} -o /tmp/profile.json -w "%{http_code}" -H "${auth_header}" "${profile_url}" || true)"
                  if [ "${status}" = "200" ]; then
                    echo "MAS profile ${profile_id} already exists."
                    exit 0
                  fi
                  if [ "${status}" != "404" ]; then
                    echo "error: unexpected status checking profile (${status})" >&2
                    cat /tmp/profile.json >&2 || true
                    exit 1
                  fi
                  echo "Creating MAS profile ${profile_id}..."
                  create_status="$(curl ${curl_args} -o /tmp/profile-create.json -w "%{http_code}" \
                    -H "${auth_header}" \
                    -H "Content-Type: application/scim+json" \
                    -X POST "${profiles_url}" \
                    -d "${payload}" || true)"
                  case "${create_status}" in
                    200|201)
                      echo "MAS profile ${profile_id} created."
                      ;;
                    409)
                      echo "MAS profile ${profile_id} already exists (conflict)."
                      ;;
                    *)
                      echo "error: failed to create MAS profile (${create_status})" >&2
                      cat /tmp/profile-create.json >&2 || true
                      exit 1
                      ;;
                  esac
          volumes:
            - name: ca-certs
              projected:
                sources:
                  - secret:
                      name: scim-bridge-ca
                      optional: true
                  - configMap:
                      name: scim-bridge-mas-ca
                      optional: true
                  - configMap:
                      name: scim-bridge-ca
                      optional: true
