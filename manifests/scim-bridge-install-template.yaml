apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: scim-bridge-install
  annotations:
    description: "Install the SCIM bridge with a demo MAS profile bootstrap."
parameters:
  - name: SCIM_BRIDGE_NAMESPACE
    value: iam
  - name: SCIM_BRIDGE_IMAGE
    value: quay.io/lee_forster/mas-iam-scim-bridge:scim-bridge-v0.1.0
  - name: SCIM_BRIDGE_KEYCLOAK_IMAGE
    value: quay.io/lee_forster/mas-iam-keycloak:scim-bridge-v0.1.0
  - name: SCIM_BRIDGE_KEYCLOAK_BASE_URL
    value: http://mas-iam-sample:8080
  - name: SCIM_BRIDGE_KEYCLOAK_REALM
    value: maximo
  - name: SCIM_BRIDGE_KEYCLOAK_CLIENT_ID
    value: scim-admin
  - name: SCIM_BRIDGE_KEYCLOAK_CLIENT_SECRET
    value: maxadmin
  - name: SCIM_BRIDGE_KEYCLOAK_RELEASE
    value: mas-iam-sample
  - name: SCIM_BRIDGE_KEYCLOAK_NAMESPACE
    value: iam
  - name: SCIM_BRIDGE_KEYCLOAK_SERVICE
    value: mas-iam-sample
  - name: SCIM_BRIDGE_KEYCLOAK_ASSIGN_MANAGED_ROLE
    value: "false"
  - name: SCIM_BRIDGE_STORAGE_CLASS
    value: rook-ceph-block
  - name: SCIM_BRIDGE_MAS_BASE_URL
    required: true
  - name: SCIM_BRIDGE_MAS_API_TOKEN_NAME
    required: true
  - name: SCIM_BRIDGE_MAS_API_TOKEN_VALUE
    required: true
  - name: SCIM_BRIDGE_MAS_PROFILE_ID
    value: demo
  - name: SCIM_BRIDGE_MAS_PROFILE_MAP
    value: ""
  - name: SCIM_BRIDGE_MAS_PROFILE_MAP_JSON
    value: ""
  - name: SCIM_BRIDGE_MAS_PROFILE_REQUIRE_LABEL
    value: "false"
  - name: SCIM_BRIDGE_MAS_AUTH_TYPE
    value: jwt
  - name: SCIM_BRIDGE_MAS_INSECURE_SKIP_VERIFY
    value: "false"
  - name: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_ENABLED
    value: "true"
  - name: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_ID
    value: demo
  - name: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_WORKSPACE_ID
    required: true
  - name: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_JSON
    value: ""
  - name: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_JOB_NAME
    value: scim-bridge-mas-profile-bootstrap
  - name: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_IMAGE
    value: curlimages/curl:8.5.0
  - name: SCIM_BRIDGE_BRIDGE_MODE
    value: poll
  - name: SCIM_BRIDGE_BRIDGE_POLL_INTERVAL
    value: 5m
  - name: SCIM_BRIDGE_BRIDGE_STATE_BACKEND
    value: filesystem
  - name: SCIM_BRIDGE_BRIDGE_STATE_PATH
    value: /var/lib/scim-bridge/state.json
  - name: SCIM_BRIDGE_BRIDGE_ALLOW_UPDATES
    value: "true"
  - name: SCIM_BRIDGE_BRIDGE_DRY_RUN
    value: "false"
  - name: SCIM_BRIDGE_INCLUDE_USERNAMES
    value: ""
  - name: SCIM_BRIDGE_INCLUDE_USERNAME_PREFIX
    value: ""
  - name: SCIM_BRIDGE_KEYCLOAK_CA_FILE
    value: ""
  - name: SCIM_BRIDGE_KEYCLOAK_INSECURE_SKIP_VERIFY
    value: "false"
  - name: SCIM_BRIDGE_MAS_CA_FILE
    value: ""
  - name: SCIM_BRIDGE_MAS_CA_BUNDLE
    value: ""
objects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: scim-bridge-config
      namespace: ${SCIM_BRIDGE_NAMESPACE}
    data:
      SCIM_BRIDGE_KEYCLOAK_BASE_URL: "${SCIM_BRIDGE_KEYCLOAK_BASE_URL}"
      SCIM_BRIDGE_KEYCLOAK_REALM: "${SCIM_BRIDGE_KEYCLOAK_REALM}"
      SCIM_BRIDGE_KEYCLOAK_CA_FILE: "${SCIM_BRIDGE_KEYCLOAK_CA_FILE}"
      SCIM_BRIDGE_KEYCLOAK_INSECURE_SKIP_VERIFY: "${SCIM_BRIDGE_KEYCLOAK_INSECURE_SKIP_VERIFY}"
      SCIM_BRIDGE_MAS_BASE_URL: "${SCIM_BRIDGE_MAS_BASE_URL}"
      SCIM_BRIDGE_MAS_PROFILE_ID: "${SCIM_BRIDGE_MAS_PROFILE_ID}"
      SCIM_BRIDGE_MAS_PROFILE_MAP: "${SCIM_BRIDGE_MAS_PROFILE_MAP}"
      SCIM_BRIDGE_MAS_PROFILE_MAP_JSON: "${SCIM_BRIDGE_MAS_PROFILE_MAP_JSON}"
      SCIM_BRIDGE_MAS_PROFILE_REQUIRE_LABEL: "${SCIM_BRIDGE_MAS_PROFILE_REQUIRE_LABEL}"
      SCIM_BRIDGE_MAS_AUTH_TYPE: "${SCIM_BRIDGE_MAS_AUTH_TYPE}"
      SCIM_BRIDGE_MAS_CA_FILE: "${SCIM_BRIDGE_MAS_CA_FILE}"
      SCIM_BRIDGE_MAS_INSECURE_SKIP_VERIFY: "${SCIM_BRIDGE_MAS_INSECURE_SKIP_VERIFY}"
      SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_ENABLED: "${SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_ENABLED}"
      SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_ID: "${SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_ID}"
      SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_WORKSPACE_ID: "${SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_WORKSPACE_ID}"
      SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_JSON: "${SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_JSON}"
      SCIM_BRIDGE_BRIDGE_MODE: "${SCIM_BRIDGE_BRIDGE_MODE}"
      SCIM_BRIDGE_BRIDGE_POLL_INTERVAL: "${SCIM_BRIDGE_BRIDGE_POLL_INTERVAL}"
      SCIM_BRIDGE_BRIDGE_STATE_BACKEND: "${SCIM_BRIDGE_BRIDGE_STATE_BACKEND}"
      SCIM_BRIDGE_BRIDGE_STATE_PATH: "${SCIM_BRIDGE_BRIDGE_STATE_PATH}"
      SCIM_BRIDGE_BRIDGE_ALLOW_UPDATES: "${SCIM_BRIDGE_BRIDGE_ALLOW_UPDATES}"
      SCIM_BRIDGE_BRIDGE_DRY_RUN: "${SCIM_BRIDGE_BRIDGE_DRY_RUN}"
      SCIM_BRIDGE_INCLUDE_USERNAMES: "${SCIM_BRIDGE_INCLUDE_USERNAMES}"
      SCIM_BRIDGE_INCLUDE_USERNAME_PREFIX: "${SCIM_BRIDGE_INCLUDE_USERNAME_PREFIX}"
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: scim-bridge-tools
      namespace: ${SCIM_BRIDGE_NAMESPACE}
    data:
      retry-errors.py: |
        #!/usr/bin/env python3
        #
        # Clear "sticky" error entries in the SCIM bridge state file so the bridge will retry.
        #
        # This edits the PVC-backed state file. The bridge should be restarted after changes so it
        # reloads state from disk and doesn't overwrite your edits with in-memory state.
        #
        # Usage:
        #   /opt/scim-bridge-tools/retry-errors --list
        #   /opt/scim-bridge-tools/retry-errors --all-errors
        #   /opt/scim-bridge-tools/retry-errors --username jane.doe
        #
        import argparse
        import datetime
        import json
        import os
        import shutil
        import sys
        from pathlib import Path


        def load_state(path: Path) -> dict:
          if not path.exists():
            return {}
          raw = path.read_text()
          if not raw.strip():
            return {}
          try:
            return json.loads(raw)
          except json.JSONDecodeError as e:
            print(f"error: failed to parse JSON in {path}: {e}", file=sys.stderr)
            sys.exit(2)


        def iter_error_entries(state: dict):
          for key, entry in state.items():
            if isinstance(entry, dict) and entry.get("status") == "error":
              yield key, entry


        def write_state(path: Path, state: dict, *, dry_run: bool) -> None:
          rendered = json.dumps(state, indent=2, sort_keys=True) + "\n"
          if dry_run:
            print(f"dry-run: would write {path} ({len(rendered)} bytes)")
            return

          mode = 0o600
          if path.exists():
            mode = path.stat().st_mode & 0o777
            ts = datetime.datetime.utcnow().strftime("%Y%m%dT%H%M%SZ")
            bak = path.with_name(path.name + f".bak.{ts}")
            shutil.copy2(path, bak)
            print(f"backup: {bak}")

          tmp = path.with_name(path.name + ".tmp")
          tmp.write_text(rendered)
          os.replace(tmp, path)
          os.chmod(path, mode)


        def select_keys(state: dict, *, ids: list, usernames: list, all_errors: bool) -> list:
          keys = set()
          if ids:
            for i in ids:
              if i in state:
                keys.add(i)
          if usernames:
            wanted = set(usernames)
            for k, entry in state.items():
              if isinstance(entry, dict) and entry.get("username") in wanted:
                keys.add(k)
          if all_errors:
            for k, _ in iter_error_entries(state):
              keys.add(k)
          return sorted(keys)


        def main() -> None:
          parser = argparse.ArgumentParser(
            description="Retry/clear sticky SCIM bridge state errors by editing the state.json file."
          )
          parser.add_argument(
            "--state-path",
            default=os.environ.get("SCIM_BRIDGE_STATE_PATH", "/var/lib/scim-bridge/state.json"),
            help="Path to the state JSON file (default: /var/lib/scim-bridge/state.json).",
          )
          parser.add_argument("--list", action="store_true", help="List current error entries and exit.")
          parser.add_argument("--all-errors", action="store_true", help="Target all entries with status=error.")
          parser.add_argument("--id", action="append", default=[], help="Target a specific Keycloak user ID (UUID).")
          parser.add_argument("--username", action="append", default=[], help="Target a username (repeatable).")
          parser.add_argument(
            "--mode",
            choices=["delete", "reset"],
            default="delete",
            help="delete removes entries; reset clears lastError and sets status=ok (keeps entry).",
          )
          parser.add_argument("--dry-run", action="store_true", help="Show what would change without writing.")
          args = parser.parse_args()

          state_path = Path(args.state_path)
          state = load_state(state_path)

          if args.list:
            errors = list(iter_error_entries(state))
            if not errors:
              print("no errors found")
              return
            for key, entry in errors:
              username = entry.get("username", "")
              mas_id = entry.get("masID", "")
              last_error = entry.get("lastError", "")
              print(f"{key}\tusername={username}\tmasID={mas_id}\tlastError={last_error}")
            return

          if not (args.all_errors or args.id or args.username):
            print("error: specify --all-errors, --id, or --username (or use --list)", file=sys.stderr)
            sys.exit(2)

          keys = select_keys(state, ids=args.id, usernames=args.username, all_errors=args.all_errors)
          if not keys:
            print("no matching entries found")
            return

          would_change = 0
          for key in keys:
            entry = state.get(key)
            if args.mode == "delete":
              if not args.dry_run:
                state.pop(key, None)
              would_change += 1
            else:
              if isinstance(entry, dict):
                if not args.dry_run:
                  entry.pop("lastError", None)
                  entry["status"] = "ok"
                would_change += 1

          print(f"matched={len(keys)} changed={would_change} mode={args.mode} dry_run={args.dry_run}")
          write_state(state_path, state, dry_run=args.dry_run)
          if args.dry_run:
            return
          print("next: restart the bridge so it reloads state from disk")
          print("  oc rollout restart deployment/scim-bridge -n <namespace>")


        if __name__ == "__main__":
          main()
      retry-errors: |
        #!/usr/bin/env sh
        set -eu
        export PYTHONDONTWRITEBYTECODE=1
        exec python3 /opt/scim-bridge-tools/retry-errors.py "$@"
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: scim-bridge-mas-ca
      namespace: ${SCIM_BRIDGE_NAMESPACE}
    data:
      mas-ca.crt: "${SCIM_BRIDGE_MAS_CA_BUNDLE}"
  - apiVersion: v1
    kind: Secret
    metadata:
      name: scim-bridge-secret
      namespace: ${SCIM_BRIDGE_NAMESPACE}
    type: Opaque
    stringData:
      SCIM_BRIDGE_KEYCLOAK_CLIENT_ID: "${SCIM_BRIDGE_KEYCLOAK_CLIENT_ID}"
      SCIM_BRIDGE_KEYCLOAK_CLIENT_SECRET: "${SCIM_BRIDGE_KEYCLOAK_CLIENT_SECRET}"
      SCIM_BRIDGE_MAS_TOKEN: ""
      SCIM_BRIDGE_MAS_API_TOKEN_NAME: "${SCIM_BRIDGE_MAS_API_TOKEN_NAME}"
      SCIM_BRIDGE_MAS_API_TOKEN_VALUE: "${SCIM_BRIDGE_MAS_API_TOKEN_VALUE}"
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: scim-bridge-state
      namespace: ${SCIM_BRIDGE_NAMESPACE}
    spec:
      storageClassName: ${SCIM_BRIDGE_STORAGE_CLASS}
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: scim-bridge
      namespace: ${SCIM_BRIDGE_NAMESPACE}
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: scim-bridge
      template:
        metadata:
          labels:
            app: scim-bridge
        spec:
          securityContext:
            runAsNonRoot: true
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: scim-bridge
              image: "${SCIM_BRIDGE_IMAGE}"
              imagePullPolicy: Always
              args:
                - "--bridge-mode=${SCIM_BRIDGE_BRIDGE_MODE}"
                - "--bridge-state-backend=${SCIM_BRIDGE_BRIDGE_STATE_BACKEND}"
                - "--bridge-state-path=${SCIM_BRIDGE_BRIDGE_STATE_PATH}"
                - "--bridge-poll-interval=${SCIM_BRIDGE_BRIDGE_POLL_INTERVAL}"
                - "--bridge-allow-updates=${SCIM_BRIDGE_BRIDGE_ALLOW_UPDATES}"
                - "--bridge-dry-run=${SCIM_BRIDGE_BRIDGE_DRY_RUN}"
              env:
                - name: SSL_CERT_FILE
                  value: /etc/scim-bridge/certs/ca-bundle.crt
                - name: SSL_CERT_DIR
                  value: /etc/scim-bridge/certs
              envFrom:
                - configMapRef:
                    name: scim-bridge-config
                - secretRef:
                    name: scim-bridge-secret
              volumeMounts:
                - name: state
                  mountPath: /var/lib/scim-bridge
                - name: ca-certs
                  mountPath: /etc/scim-bridge/certs
                  readOnly: true
            - name: state-tools
              image: registry.access.redhat.com/ubi9/ubi
              imagePullPolicy: IfNotPresent
              command: ["sleep", "infinity"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              volumeMounts:
                - name: state
                  mountPath: /var/lib/scim-bridge
                - name: tools
                  mountPath: /opt/scim-bridge-tools
                  readOnly: true
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: scim-bridge-state
            - name: ca-certs
              projected:
                sources:
                  - secret:
                      name: scim-bridge-ca
                      optional: true
                  - configMap:
                      name: scim-bridge-mas-ca
                      optional: true
                  - configMap:
                      name: scim-bridge-ca
                      optional: true
            - name: tools
              configMap:
                name: scim-bridge-tools
                defaultMode: 0555
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: scim-bridge-keycloak-bootstrap
      namespace: ${SCIM_BRIDGE_KEYCLOAK_NAMESPACE}
      labels:
        app.kubernetes.io/name: scim-bridge
        app.kubernetes.io/component: keycloak-bootstrap
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: scim-bridge
            app.kubernetes.io/component: keycloak-bootstrap
        spec:
          restartPolicy: OnFailure
          containers:
            - name: keycloak-bootstrap
              image: "${SCIM_BRIDGE_KEYCLOAK_IMAGE}"
              imagePullPolicy: IfNotPresent
              env:
                - name: HOME
                  value: /tmp/kcadm
                - name: KC_HOST
                  value: "http://${SCIM_BRIDGE_KEYCLOAK_SERVICE}:8080"
                - name: SCIM_REALM
                  value: "${SCIM_BRIDGE_KEYCLOAK_REALM}"
                - name: SCIM_CLIENT_ID
                  value: "${SCIM_BRIDGE_KEYCLOAK_CLIENT_ID}"
                - name: SCIM_ASSIGN_MANAGED_ROLE
                  value: "${SCIM_BRIDGE_KEYCLOAK_ASSIGN_MANAGED_ROLE}"
                - name: KC_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: "${SCIM_BRIDGE_KEYCLOAK_RELEASE}-bootstrap-admin"
                      key: username
                - name: KC_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: "${SCIM_BRIDGE_KEYCLOAK_RELEASE}-bootstrap-admin"
                      key: password
                - name: SCIM_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: scim-bridge-secret
                      key: SCIM_BRIDGE_KEYCLOAK_CLIENT_SECRET
              command:
                - /bin/bash
                - -ec
                - |
                  set -euo pipefail
                  mkdir -p "${HOME}/.keycloak"
                  if [[ -z "${SCIM_CLIENT_SECRET}" ]]; then
                    echo "error: SCIM_CLIENT_SECRET is empty; populate scim-bridge-secret.SCIM_BRIDGE_KEYCLOAK_CLIENT_SECRET" >&2
                    exit 1
                  fi
                  host_port="${KC_HOST#*://}"
                  if [[ "$host_port" == "$KC_HOST" ]]; then
                    host_port="$KC_HOST"
                  fi
                  host_port="${host_port%%/*}"
                  host="${host_port%%:*}"
                  port="${host_port##*:}"
                  if [[ "$port" == "$host_port" ]]; then
                    port="8080"
                  fi
                  echo "Waiting for Keycloak service ${host}:${port}..."
                  until (echo >"/dev/tcp/${host}/${port}") >/dev/null 2>&1; do
                    sleep 5
                  done
                  echo "Waiting for Keycloak admin API..."
                  until /opt/keycloak/bin/kcadm.sh config credentials \
                    --server "$KC_HOST" \
                    --realm master \
                    --user "$KC_ADMIN_USER" \
                    --password "$KC_ADMIN_PASSWORD" >/dev/null 2>&1; do
                    sleep 5
                  done
                  for role in scim-access scim-managed; do
                    /opt/keycloak/bin/kcadm.sh create roles -r "${SCIM_REALM}" -s "name=${role}" >/dev/null 2>&1 || true
                  done
                  client_uuid="$(
                    /opt/keycloak/bin/kcadm.sh get clients -r "${SCIM_REALM}" --fields clientId,id --format csv --noquotes 2>/dev/null \
                      | tr -d '\r' \
                      | { grep -F "${SCIM_CLIENT_ID}," || true; } \
                      | cut -d, -f2 \
                      | head -n1
                  )"
                  if [[ -z "${client_uuid}" ]]; then
                    /opt/keycloak/bin/kcadm.sh create clients -r "${SCIM_REALM}" \
                      -s "clientId=${SCIM_CLIENT_ID}" \
                      -s enabled=true \
                      -s protocol=openid-connect \
                      -s serviceAccountsEnabled=true \
                      -s publicClient=false \
                      -s standardFlowEnabled=false \
                      -s directAccessGrantsEnabled=false \
                      -s "secret=${SCIM_CLIENT_SECRET}" >/dev/null
                    client_uuid="$(
                      /opt/keycloak/bin/kcadm.sh get clients -r "${SCIM_REALM}" --fields clientId,id --format csv --noquotes 2>/dev/null \
                        | tr -d '\r' \
                        | { grep -F "${SCIM_CLIENT_ID}," || true; } \
                        | cut -d, -f2 \
                        | head -n1
                    )"
                  else
                    /opt/keycloak/bin/kcadm.sh update "clients/${client_uuid}" -r "${SCIM_REALM}" \
                      -s enabled=true \
                      -s protocol=openid-connect \
                      -s serviceAccountsEnabled=true \
                      -s publicClient=false \
                      -s standardFlowEnabled=false \
                      -s directAccessGrantsEnabled=false \
                      -s "secret=${SCIM_CLIENT_SECRET}" >/dev/null
                  fi
                  if [[ -z "${client_uuid}" ]]; then
                    echo "error: failed to resolve Keycloak client UUID after create/update" >&2
                    exit 1
                  fi
                  sa_id=""
                  for _ in {1..30}; do
                    sa_id="$(
                      /opt/keycloak/bin/kcadm.sh get users -r "${SCIM_REALM}" -q "username=service-account-${SCIM_CLIENT_ID}" \
                        --fields id --format csv --noquotes 2>/dev/null \
                        | tr -d '\\r' \
                        | head -n1
                    )"
                    [[ -n "$sa_id" ]] && break
                    sleep 2
                  done
                  if [[ -z "${sa_id}" ]]; then
                    echo "error: failed to resolve service account user ID for ${SCIM_CLIENT_ID}" >&2
                    /opt/keycloak/bin/kcadm.sh get users -r "${SCIM_REALM}" -q "username=service-account-${SCIM_CLIENT_ID}" || true
                    exit 1
                  fi
                  /opt/keycloak/bin/kcadm.sh add-roles -r "${SCIM_REALM}" \
                    --uid "${sa_id}" \
                    --rolename scim-access >/dev/null 2>&1 || true
                  if [[ "${SCIM_ASSIGN_MANAGED_ROLE}" == "true" ]]; then
                    /opt/keycloak/bin/kcadm.sh add-roles -r "${SCIM_REALM}" \
                      --uid "${sa_id}" \
                      --rolename scim-managed >/dev/null 2>&1 || true
                  fi
                  for role in view-users query-users query-groups; do
                    /opt/keycloak/bin/kcadm.sh add-roles -r "${SCIM_REALM}" \
                      --uid "${sa_id}" \
                      --cclientid realm-management \
                      --rolename "${role}" >/dev/null 2>&1 || true
                  done
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: ${SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_JOB_NAME}
      namespace: ${SCIM_BRIDGE_NAMESPACE}
      labels:
        app.kubernetes.io/name: scim-bridge
        app.kubernetes.io/component: mas-profile-bootstrap
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: scim-bridge
            app.kubernetes.io/component: mas-profile-bootstrap
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mas-profile-bootstrap
              image: "${SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_IMAGE}"
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: scim-bridge-config
                - secretRef:
                    name: scim-bridge-secret
              volumeMounts:
                - name: ca-certs
                  mountPath: /etc/scim-bridge/certs
                  readOnly: true
              command:
                - /bin/sh
                - -ec
                - |
                  set -eu
                  if [ "${SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_ENABLED:-false}" != "true" ]; then
                    echo "MAS profile bootstrap disabled; skipping."
                    exit 0
                  fi
                  if [ -z "${SCIM_BRIDGE_MAS_BASE_URL:-}" ]; then
                    echo "error: SCIM_BRIDGE_MAS_BASE_URL is required" >&2
                    exit 1
                  fi
                  profile_id="${SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_ID:-}"
                  if [ -z "${profile_id}" ]; then
                    echo "error: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_ID is required" >&2
                    exit 1
                  fi
                  base="${SCIM_BRIDGE_MAS_BASE_URL%/}"
                  auth_root="${base%/scim/v2}"
                  auth_url="${auth_root}/v1/authenticate"
                  profiles_url="${base}/Profiles"
                  profile_url="${profiles_url}/${profile_id}"
                  curl_args="-sS"
                  if [ "${SCIM_BRIDGE_MAS_INSECURE_SKIP_VERIFY:-false}" = "true" ]; then
                    curl_args="${curl_args} -k"
                  fi
                  if [ -n "${SCIM_BRIDGE_MAS_CA_FILE:-}" ]; then
                    curl_args="${curl_args} --cacert ${SCIM_BRIDGE_MAS_CA_FILE}"
                  fi
                  token="${SCIM_BRIDGE_MAS_TOKEN:-}"
                  auth_type="${SCIM_BRIDGE_MAS_AUTH_TYPE:-jwt}"
                  if [ -z "${token}" ]; then
                    if [ -z "${SCIM_BRIDGE_MAS_API_TOKEN_NAME:-}" ] || [ -z "${SCIM_BRIDGE_MAS_API_TOKEN_VALUE:-}" ]; then
                      echo "error: set SCIM_BRIDGE_MAS_TOKEN or SCIM_BRIDGE_MAS_API_TOKEN_NAME/VALUE" >&2
                      exit 1
                    fi
                    resp="$(curl ${curl_args} -u "${SCIM_BRIDGE_MAS_API_TOKEN_NAME}:${SCIM_BRIDGE_MAS_API_TOKEN_VALUE}" "${auth_url}")"
                    token="$(printf '%s' "${resp}" | tr -d '\r\n' | sed 's/.*\"token\"[[:space:]]*:[[:space:]]*\"//; s/\".*//')"
                    case "${token}" in
                      *.*.*) ;;
                      *)
                        echo "error: failed to parse token from MAS auth response" >&2
                        echo "response length: ${#resp}" >&2
                        exit 1
                        ;;
                    esac
                    auth_type="jwt"
                  fi
                  auth_header="Authorization: Bearer ${token}"
                  if [ "${auth_type}" = "api-key" ]; then
                    auth_header="Authorization: APIKey ${token}"
                  fi
                  payload="${SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_JSON:-}"
                  if [ -z "${payload}" ]; then
                    workspace_id="${SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_WORKSPACE_ID:-}"
                    if [ -z "${workspace_id}" ]; then
                      echo "error: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_WORKSPACE_ID is required when no JSON payload is provided" >&2
                      exit 1
                    fi
                    payload="$(printf '{"id":"%s","version":1,"identities":[{"type":"local"},{"id":"default-saml","type":"saml","samlId":"userName"}],"entitlement":{"application":"PREMIUM","admin":"ADMIN_PREMIUM"},"workspaces":[{"id":"%s","applications":["manage","iot","monitor"]}]}' "${profile_id}" "${workspace_id}")"
                  fi
                  echo "Checking for existing MAS profile ${profile_id}..."
                  status="$(curl ${curl_args} -o /tmp/profile.json -w "%{http_code}" -H "${auth_header}" "${profile_url}" || true)"
                  if [ "${status}" = "200" ]; then
                    echo "MAS profile ${profile_id} already exists."
                    exit 0
                  fi
                  if [ "${status}" != "404" ]; then
                    echo "error: unexpected status checking profile (${status})" >&2
                    cat /tmp/profile.json >&2 || true
                    exit 1
                  fi
                  echo "Creating MAS profile ${profile_id}..."
                  create_status="$(curl ${curl_args} -o /tmp/profile-create.json -w "%{http_code}" \
                    -H "${auth_header}" \
                    -H "Content-Type: application/scim+json" \
                    -X POST "${profiles_url}" \
                    -d "${payload}" || true)"
                  case "${create_status}" in
                    200|201)
                      echo "MAS profile ${profile_id} created."
                      ;;
                    409)
                      echo "MAS profile ${profile_id} already exists (conflict)."
                      ;;
                    *)
                      echo "error: failed to create MAS profile (${create_status})" >&2
                      cat /tmp/profile-create.json >&2 || true
                      exit 1
                      ;;
                  esac
          volumes:
            - name: ca-certs
              projected:
                sources:
                  - secret:
                      name: scim-bridge-ca
                      optional: true
                  - configMap:
                      name: scim-bridge-mas-ca
                      optional: true
                  - configMap:
                      name: scim-bridge-ca
                      optional: true
