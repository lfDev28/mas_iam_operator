# Sample MasIamStack custom resources for development installs.
# Apply after the operator CSV is ready (Subscription installed).
# Includes a dev-only OpenLDAP TLS generator job.

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mas-est-iam-openldap-tls-generator
  namespace: mas-est
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mas-est-iam-openldap-tls-generator
  namespace: mas-est
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas-est-iam-openldap-tls-generator
  namespace: mas-est
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mas-est-iam-openldap-tls-generator
subjects:
- kind: ServiceAccount
  name: mas-est-iam-openldap-tls-generator
  namespace: mas-est
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: mas-est-iam-openldap-tls-generator
  annotations:
    kubernetes.io/description: SCC scoped to the TLS generator job for dev installs.
priority: 5
allowPrivilegedContainer: false
allowPrivilegeEscalation: true
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowedCapabilities: []
defaultAddCapabilities: []
requiredDropCapabilities:
- MKNOD
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
readOnlyRootFilesystem: false
volumes:
- configMap
- csi
- downwardAPI
- emptyDir
- ephemeral
- persistentVolumeClaim
- projected
- secret
users:
- system:serviceaccount:mas-est:mas-est-iam-openldap-tls-generator
groups: []
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mas-est-iam-generate-openldap-tls
  namespace: mas-est
  labels:
    app.kubernetes.io/component: openldap
    app.kubernetes.io/instance: mas-est-iam
    app.kubernetes.io/name: keycloak
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/component: openldap
        app.kubernetes.io/instance: mas-est-iam
        app.kubernetes.io/name: keycloak
    spec:
      restartPolicy: OnFailure
      serviceAccountName: mas-est-iam-openldap-tls-generator
      containers:
      - name: generate
        image: quay.io/lee_forster/openldap-tls-generator:0.1.0
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 10001
        env:
        - name: OPENLDAP_RELEASE
          value: mas-est-iam
        - name: LDAP_TRUSTSTORE_PASSWORD
          value: ""
        command:
        - /bin/bash
        - -ec
        - |
          set -euo pipefail
          if ! command -v openssl >/dev/null 2>&1; then
            echo "openssl is required but not available" >&2
            exit 1
          fi

          if command -v kubectl >/dev/null 2>&1; then
            kubectl_bin=kubectl
          elif command -v oc >/dev/null 2>&1; then
            kubectl_bin=oc
          else
            echo "kubectl (or oc) is required but not available" >&2
            exit 1
          fi

          namespace="${TARGET_NAMESPACE:-$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)}"
          release="${OPENLDAP_RELEASE:-mas-est-iam}"
          truststore_password="${LDAP_TRUSTSTORE_PASSWORD:-}"
          if [[ -z "${truststore_password}" || "${truststore_password}" == "random" ]]; then
            while true; do
              truststore_password="$(head -c 32 /dev/urandom | LC_ALL=C tr -dc 'A-Za-z0-9')"
              if [[ ${#truststore_password} -ge 12 ]]; then
                break
              fi
            done
          fi

          service_host="${release}-openldap"
          svc_fqdn="${service_host}.${namespace}.svc"
          svc_cluster_fqdn="${svc_fqdn}.cluster.local"
          secret="${release}-keycloak-openldap-tls"

          workdir="$(mktemp -d)"
          cleanup() {
            rm -rf "${workdir}"
          }
          trap cleanup EXIT
          pushd "${workdir}" >/dev/null

          openssl genrsa -out ca.key 4096
          openssl req -x509 -new -key ca.key -sha256 -days 3650 \
            -out ca.crt \
            -subj "/CN=${release} OpenLDAP Dev CA"

          openssl genrsa -out server.key 4096
          openssl req -new -key server.key -out server.csr \
            -subj "/CN=${svc_fqdn}"

          cat > server.ext <<EOF
          subjectAltName=DNS:${service_host},DNS:${svc_fqdn},DNS:${svc_cluster_fqdn}
          EOF

          openssl x509 -req -in server.csr \
            -CA ca.crt -CAkey ca.key -CAcreateserial \
            -out server.crt -days 730 -sha256 \
            -extfile server.ext

          openssl pkcs12 -export \
            -in ca.crt \
            -nokeys \
            -out ldap-truststore.p12 \
            -passout pass:"${truststore_password}"

          api_server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
          token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          cacert="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          kubectl_args=(--server "${api_server}" --token "${token}" --certificate-authority "${cacert}" --namespace "${namespace}")

          "${kubectl_bin}" "${kubectl_args[@]}" delete secret "${secret}" --ignore-not-found
          "${kubectl_bin}" "${kubectl_args[@]}" create secret generic "${secret}" \
            --from-file=ca.crt=ca.crt \
            --from-file=tls.crt=server.crt \
            --from-file=tls.key=server.key \
            --from-file=ldap-truststore.p12=ldap-truststore.p12 \
            --from-literal=truststorePassword="${truststore_password}" \
            --dry-run=client -o yaml | "${kubectl_bin}" "${kubectl_args[@]}" apply -f -

          "${kubectl_bin}" "${kubectl_args[@]}" label secret "${secret}" \
            app.kubernetes.io/name="${release}" \
            app.kubernetes.io/component=openldap \
            --overwrite

          "${kubectl_bin}" "${kubectl_args[@]}" annotate secret "${secret}" \
            mas.ibm.com/generated-by=mas-est-dev \
            mas.ibm.com/description="Self-signed TLS material for the Keycloak/OpenLDAP integration (development use only)." \
            --overwrite

          echo "Generated ${secret} in namespace ${namespace}."
          echo "Retrieve the truststore password with:"
          echo "  kubectl get secret ${secret} -n ${namespace} -o jsonpath='{.data.truststorePassword}' | base64 -d && echo"
---
# Demo-only credentials (fixed password). Replace for non-dev installs.
apiVersion: v1
kind: Secret
metadata:
  name: mas-est-iam-bootstrap-admin
  namespace: mas-est
type: Opaque
stringData:
  username: admin
  password: maxadmin
---
apiVersion: v1
kind: Secret
metadata:
  name: mas-est-iam-openldap-admin
  namespace: mas-est
type: Opaque
stringData:
  password: maxadmin
  configPassword: maxadmin
---
apiVersion: v1
kind: Secret
metadata:
  name: mas-est-iam-openldap-user-passwords
  namespace: mas-est
type: Opaque
stringData:
  # NOTE: The operator's chart bundle still ships the old LDIF (sysadmin,
  # jane.doe, joe.bloggs, alex.manager). Until the operator image is rebuilt
  # with the trimmed dev-base.ldif, these keys must remain — they correspond
  # to the @@PASSWORD{...}@@ placeholders the seed-init container expects.
  # The SCIM bridge filter (include-username-prefix: scim.) ensures none of
  # these legacy users reach MAS Core via the bridge.
  sysadmin: maxadmin
  jane.doe: maxadmin
  joe.bloggs: maxadmin
  alex.manager: maxadmin
  ldap.user1: maxadmin
  ldap.user2: maxadmin
---
apiVersion: v1
kind: Secret
metadata:
  name: mas-est-iam-postgresql
  namespace: mas-est
type: Opaque
stringData:
  # PostgreSQL only applies these when it initialises an empty data directory, so on
  # a stack that already has a PVC they must match the password the PVC was created
  # with — changing them here does not re-key an existing database.
  password: maxadmin
  postgres-password: maxadmin
  replication-password: maxadmin
---
# Optional: example MasIamStack custom resource once the operator CSV is ready.
# Ensure the required LDAP TLS secret exists (see documentation) before applying.
apiVersion: iam.mas.ibm.com/v1alpha1
kind: MasIamStack
metadata:
  name: mas-est-iam
  namespace: mas-est
spec:
  # Create the referenced secrets before applying this sample:
  # - mas-est-iam-bootstrap-admin (username, password)
  # - mas-est-iam-openldap-admin (password, configPassword if enabled)
  # - mas-est-iam-openldap-user-passwords (one key per seeded user)
  # - mas-est-iam-postgresql (password, postgres-password, replication-password if used)
  keycloak:
    bootstrapAdmin:
      createSecret: false
      secretName: mas-est-iam-bootstrap-admin
    scim:
      enabled: false
      authenticationMode: KEYCLOAK
    ldap:
      autoConfigure: true
      autoConfigureOnUpgrade: false
      # Populate with the name of the secret containing LDAP bind credentials.
      bindCredentialSecret: mas-est-iam-openldap-admin
      # Provide the ldaps:// endpoint for your LDAP server.
      connectionUrl: "ldaps://mas-est-iam-openldap.mas-est.svc.cluster.local:636"
      tls:
        enabled: true
        caSecret: mas-est-iam-keycloak-openldap-tls
        truststorePasswordSecret: mas-est-iam-keycloak-openldap-tls
        truststorePasswordKey: truststorePassword
  openldap:
    enabled: true
    admin:
      createSecret: false
      secretName: mas-est-iam-openldap-admin
    userPasswords:
      createSecret: false
      secretName: mas-est-iam-openldap-user-passwords
  postgresql:
    auth:
      existingSecret: mas-est-iam-postgresql
    global:
      postgresql:
        auth:
          existingSecret: mas-est-iam-postgresql
    primary:
      persistence:
        # scripts/install-olm-sample.sh injects an explicit storageClass here.
        # Raw manifest apply falls back to cluster/operator defaults and is not the
        # primary documented install path.
