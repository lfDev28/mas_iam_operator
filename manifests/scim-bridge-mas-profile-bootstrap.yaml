apiVersion: batch/v1
kind: Job
metadata:
  name: ${SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_JOB_NAME}
  namespace: ${SCIM_BRIDGE_NAMESPACE}
  labels:
    app.kubernetes.io/name: scim-bridge
    app.kubernetes.io/component: mas-profile-bootstrap
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scim-bridge
        app.kubernetes.io/component: mas-profile-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mas-profile-bootstrap
          image: "${SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_IMAGE}"
          imagePullPolicy: IfNotPresent
          env:
            - name: MAS_PROFILE_BOOTSTRAP_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: scim-bridge-config
                  key: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_ENABLED
            - name: MAS_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: scim-bridge-config
                  key: SCIM_BRIDGE_MAS_BASE_URL
            - name: MAS_PROFILE_ID
              valueFrom:
                configMapKeyRef:
                  name: scim-bridge-config
                  key: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_ID
            - name: MAS_WORKSPACE_ID
              valueFrom:
                configMapKeyRef:
                  name: scim-bridge-config
                  key: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_WORKSPACE_ID
            - name: MAS_PROFILE_BOOTSTRAP_JSON
              valueFrom:
                configMapKeyRef:
                  name: scim-bridge-config
                  key: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_JSON
            - name: MAS_INSECURE_SKIP_VERIFY
              valueFrom:
                configMapKeyRef:
                  name: scim-bridge-config
                  key: SCIM_BRIDGE_MAS_INSECURE_SKIP_VERIFY
            - name: MAS_CA_FILE
              valueFrom:
                configMapKeyRef:
                  name: scim-bridge-config
                  key: SCIM_BRIDGE_MAS_CA_FILE
            - name: MAS_AUTH_TYPE
              valueFrom:
                configMapKeyRef:
                  name: scim-bridge-config
                  key: SCIM_BRIDGE_MAS_AUTH_TYPE
            - name: MAS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: scim-bridge-secret
                  key: SCIM_BRIDGE_MAS_TOKEN
            - name: MAS_API_TOKEN_NAME
              valueFrom:
                secretKeyRef:
                  name: scim-bridge-secret
                  key: SCIM_BRIDGE_MAS_API_TOKEN_NAME
            - name: MAS_API_TOKEN_VALUE
              valueFrom:
                secretKeyRef:
                  name: scim-bridge-secret
                  key: SCIM_BRIDGE_MAS_API_TOKEN_VALUE
          volumeMounts:
            - name: ca-certs
              mountPath: /etc/scim-bridge/certs
              readOnly: true
          command:
            - /bin/sh
            - -ec
            - |
              set -eu

              if [ "${MAS_PROFILE_BOOTSTRAP_ENABLED:-false}" != "true" ]; then
                echo "MAS profile bootstrap disabled; skipping."
                exit 0
              fi

              if [ -z "${MAS_BASE_URL:-}" ]; then
                echo "error: MAS_BASE_URL is required" >&2
                exit 1
              fi
              case "${MAS_BASE_URL}" in
                http://http://*|https://https://*|http://https://*|https://http://*)
                  echo "error: MAS_BASE_URL is malformed (${MAS_BASE_URL})" >&2
                  exit 1
                  ;;
              esac

              profile_id="${MAS_PROFILE_ID:-}"
              if [ -z "${profile_id}" ]; then
                echo "error: MAS_PROFILE_ID is required" >&2
                exit 1
              fi

              base="${MAS_BASE_URL%/}"
              auth_root="${base%/scim/v2}"
              auth_url="${auth_root}/v1/authenticate"
              profiles_url="${base}/Profiles"
              profile_url="${profiles_url}/${profile_id}"

              curl_args="-sS"
              if [ "${MAS_INSECURE_SKIP_VERIFY:-false}" = "true" ]; then
                curl_args="${curl_args} -k"
              fi
              if [ -n "${MAS_CA_FILE:-}" ]; then
                curl_args="${curl_args} --cacert ${MAS_CA_FILE}"
              fi

              token="${MAS_TOKEN:-}"
              auth_type="${MAS_AUTH_TYPE:-jwt}"
              if [ -z "${token}" ]; then
                if [ -z "${MAS_API_TOKEN_NAME:-}" ] || [ -z "${MAS_API_TOKEN_VALUE:-}" ]; then
                  echo "error: set MAS_TOKEN or MAS_API_TOKEN_NAME/VALUE" >&2
                  exit 1
                fi
                resp="$(curl ${curl_args} -u "${MAS_API_TOKEN_NAME}:${MAS_API_TOKEN_VALUE}" "${auth_url}")"
                token="$(printf '%s' "${resp}" | tr -d '\r\n' | sed 's/.*"token"[[:space:]]*:[[:space:]]*"//; s/".*//')"
                case "${token}" in
                  *.*.*) ;;
                  *)
                    echo "error: failed to parse token from MAS auth response" >&2
                    echo "response length: ${#resp}" >&2
                    exit 1
                    ;;
                esac
                auth_type="jwt"
              fi

              auth_header="Authorization: Bearer ${token}"
              if [ "${auth_type}" = "api-key" ]; then
                auth_header="Authorization: APIKey ${token}"
              fi

              payload="${MAS_PROFILE_BOOTSTRAP_JSON:-}"
              if [ -z "${payload}" ]; then
                workspace_id="${MAS_WORKSPACE_ID:-}"
                if [ -z "${workspace_id}" ]; then
                  echo "error: MAS_WORKSPACE_ID is required when no JSON payload is provided" >&2
                  exit 1
                fi
                payload="$(printf '{"id":"%s","version":1,"identities":[{"type":"local"}],"entitlement":{"application":"PREMIUM","admin":"ADMIN_PREMIUM"},"workspaces":[{"id":"%s","applications":["manage"]}]}' "${profile_id}" "${workspace_id}")"
              fi

              echo "Checking for existing MAS profile ${profile_id}..."
              status="$(curl ${curl_args} -o /tmp/profile.json -w "%{http_code}" -H "${auth_header}" "${profile_url}" || true)"
              if [ "${status}" = "200" ]; then
                echo "MAS profile ${profile_id} already exists."
                exit 0
              fi
              if [ "${status}" != "404" ]; then
                echo "error: unexpected status checking profile (${status})" >&2
                cat /tmp/profile.json >&2 || true
                exit 1
              fi

              echo "Creating MAS profile ${profile_id}..."
              create_status="$(curl ${curl_args} -o /tmp/profile-create.json -w "%{http_code}" \
                -H "${auth_header}" \
                -H "Content-Type: application/scim+json" \
                -X POST "${profiles_url}" \
                -d "${payload}" || true)"

              case "${create_status}" in
                200|201)
                  echo "MAS profile ${profile_id} created."
                  ;;
                409)
                  echo "MAS profile ${profile_id} already exists (conflict)."
                  ;;
                *)
                  echo "error: failed to create MAS profile (${create_status})" >&2
                  cat /tmp/profile-create.json >&2 || true
                  exit 1
                  ;;
              esac
      volumes:
        - name: ca-certs
          projected:
            sources:
              - secret:
                  name: scim-bridge-ca
                  optional: true
              - configMap:
                  name: scim-bridge-mas-ca
                  optional: true
              - configMap:
                  name: scim-bridge-ca
                  optional: true
