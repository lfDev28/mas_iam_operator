apiVersion: apps/v1
kind: Deployment
metadata:
  name: scim-bridge
  namespace: mas-est
spec:
  replicas: 1
  strategy:
    type: Recreate
  imagePullSecrets: []
  selector:
    matchLabels:
      app: scim-bridge
  template:
    metadata:
      labels:
        app: scim-bridge
    spec:
      securityContext:
        runAsNonRoot: true

      containers:
        - name: scim-bridge
          image: "quay.io/lee_forster/mas-iam-scim-bridge:scim-bridge-v0.1.2"
          imagePullPolicy: Always
          args:
            - "--bridge-mode=poll"
            - "--bridge-state-backend=filesystem"
            - "--bridge-state-path=/var/lib/scim-bridge/state.json"
          # The health server listens on 8081 by default
          # (SCIM_BRIDGE_HEALTH_PORT). No flag here on purpose: bridge images
          # before the health server reject unknown flags and would crash.
          #
          # SSL_CERT_FILE is deliberately unset: setting it replaced the
          # image's system roots. SSL_CERT_DIR adds every cert mounted in
          # /etc/scim-bridge/certs on top of the system roots, and the
          # KEYCLOAK/MAS_CA_FILE settings add theirs the same way.
          env:
            - name: SSL_CERT_DIR
              value: /etc/scim-bridge/certs
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            failureThreshold: 3
          # /healthz fails only after 5 poll intervals without a successful
          # sync cycle (SCIM_BRIDGE_HEALTH_STALE_CYCLES), so a short
          # Keycloak/MAS outage does not restart the pod.
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - configMapRef:
                name: scim-bridge-config
            - secretRef:
                name: scim-bridge-secret
          volumeMounts:
            - name: state
              mountPath: /var/lib/scim-bridge
            - name: ca-certs
              mountPath: /etc/scim-bridge/certs
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: scim-bridge-state
        - name: ca-certs
          projected:
            sources:
              - secret:
                  name: scim-bridge-ca
                  optional: true
              - configMap:
                  name: scim-bridge-mas-ca
                  optional: true
              - configMap:
                  name: scim-bridge-ca
                  optional: true

