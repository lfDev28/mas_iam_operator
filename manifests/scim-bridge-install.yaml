apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scim-bridge-state
  namespace: mas-est
spec:
  storageClassName:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
