apiVersion: batch/v1
kind: Job
metadata:
  name: scim-bridge-keycloak-route-cert
  namespace: iam
  labels:
    app.kubernetes.io/name: scim-bridge
    app.kubernetes.io/component: keycloak-route-cert
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scim-bridge
        app.kubernetes.io/component: keycloak-route-cert
    spec:
      restartPolicy: OnFailure
      serviceAccountName: scim-bridge-route-cert
      containers:
        - name: route-cert
          image: "registry.redhat.io/openshift4/ose-cli"
          imagePullPolicy: IfNotPresent
          env:
            - name: SCIM_BRIDGE_KEYCLOAK_ROUTE_NAMESPACE
              value: "iam"
            - name: SCIM_BRIDGE_KEYCLOAK_ROUTE_NAME
              value: "scim-bridge-keycloak"
            - name: SCIM_BRIDGE_KEYCLOAK_ROUTE_CERT_DAYS
              value: "825"
            - name: SCIM_BRIDGE_KEYCLOAK_ROUTE_SERVICE
              value: "mas-iam-sample"
            - name: SCIM_BRIDGE_NAMESPACE
              value: "iam"
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail

              route_namespace="iam"
              route_name="scim-bridge-keycloak"
              bridge_namespace="iam"
              cert_days="825"
              route_service="mas-iam-sample"

              if [[ -z "" || -z "" ]]; then
                echo "error: route namespace/name is required" >&2
                exit 1
              fi

              if [[ -z "" ]]; then
                echo "error: SCIM_BRIDGE_KEYCLOAK_ROUTE_SERVICE is required" >&2
                exit 1
              fi

              workdir="$(mktemp -d)"
              cleanup() { rm -rf ""; }
              trap cleanup EXIT

              {
                echo "apiVersion: route.openshift.io/v1"
                echo "kind: Route"
                echo "metadata:"
                echo "  name: "
                echo "  namespace: "
                echo "spec:"
                echo "  to:"
                echo "    kind: Service"
                echo "    name: "
                echo "  port:"
                echo "    targetPort: http"
                echo "  tls:"
                echo "    termination: edge"
                echo "    insecureEdgeTerminationPolicy: Redirect"
              } >"/route.yaml"

              oc delete route -n "" "" --ignore-not-found >/dev/null 2>&1 || true
              oc apply -f "/route.yaml"

              route_host="$(oc get route -n "" "" -o jsonpath='{.spec.host}' 2>/dev/null || true)"
              if [[ -z "" ]]; then
                echo "error: failed to resolve generated host for route " >&2
                exit 1
              fi

              cert_chain="/route-chain.crt"
              for _ in {1..30}; do
                echo | openssl s_client -showcerts -servername "" -connect ":443" 2>/dev/null \
                  | sed -n '/BEGIN CERTIFICATE/,/END CERTIFICATE/p' >"" || true
                if grep -q "BEGIN CERTIFICATE" ""; then
                  break
                fi
                sleep 5
              done

              if ! grep -q "BEGIN CERTIFICATE" ""; then
                echo "error: failed to fetch route certificate chain for " >&2
                exit 1
              fi

              bundle_source="/etc/pki/tls/certs/ca-bundle.crt"
              if [[ -f "" ]]; then
                cat "" "" >"/ca-bundle.crt"
              else
                cp "" "/ca-bundle.crt"
              fi

              oc create secret generic scim-bridge-ca \
                -n "" \
                --from-file=keycloak-ca.crt="" \
                --from-file=ca-bundle.crt="/ca-bundle.crt" \
                --dry-run=client -o yaml | oc apply --server-side -f -

---
apiVersion: batch/v1
kind: Job
metadata:
  name: scim-bridge-mas-profile-bootstrap
  namespace: iam
  labels:
    app.kubernetes.io/name: scim-bridge
    app.kubernetes.io/component: mas-profile-bootstrap
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scim-bridge
        app.kubernetes.io/component: mas-profile-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mas-profile-bootstrap
          image: "curlimages/curl:8.5.0"
          imagePullPolicy: IfNotPresent
          env:
            - name: MAS_PROFILE_BOOTSTRAP_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: scim-bridge-config
                  key: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_ENABLED
            - name: MAS_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: scim-bridge-config
                  key: SCIM_BRIDGE_MAS_BASE_URL
            - name: MAS_PROFILE_ID
              valueFrom:
                configMapKeyRef:
                  name: scim-bridge-config
                  key: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_ID
            - name: MAS_WORKSPACE_ID
              valueFrom:
                configMapKeyRef:
                  name: scim-bridge-config
                  key: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_WORKSPACE_ID
            - name: MAS_PROFILE_BOOTSTRAP_JSON
              valueFrom:
                configMapKeyRef:
                  name: scim-bridge-config
                  key: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_JSON
            - name: MAS_INSECURE_SKIP_VERIFY
              valueFrom:
                configMapKeyRef:
                  name: scim-bridge-config
                  key: SCIM_BRIDGE_MAS_INSECURE_SKIP_VERIFY
            - name: MAS_CA_FILE
              valueFrom:
                configMapKeyRef:
                  name: scim-bridge-config
                  key: SCIM_BRIDGE_MAS_CA_FILE
            - name: MAS_AUTH_TYPE
              valueFrom:
                configMapKeyRef:
                  name: scim-bridge-config
                  key: SCIM_BRIDGE_MAS_AUTH_TYPE
            - name: MAS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: scim-bridge-secret
                  key: SCIM_BRIDGE_MAS_TOKEN
            - name: MAS_API_TOKEN_NAME
              valueFrom:
                secretKeyRef:
                  name: scim-bridge-secret
                  key: SCIM_BRIDGE_MAS_API_TOKEN_NAME
            - name: MAS_API_TOKEN_VALUE
              valueFrom:
                secretKeyRef:
                  name: scim-bridge-secret
                  key: SCIM_BRIDGE_MAS_API_TOKEN_VALUE
          volumeMounts:
            - name: ca-certs
              mountPath: /etc/scim-bridge/certs
              readOnly: true
          command:
            - /bin/sh
            - -ec
            - |
              set -eu

              if [ "${MAS_PROFILE_BOOTSTRAP_ENABLED:-false}" != "true" ]; then
                echo "MAS profile bootstrap disabled; skipping."
                exit 0
              fi

              if [ -z "${MAS_BASE_URL:-}" ]; then
                echo "error: MAS_BASE_URL is required" >&2
                exit 1
              fi
              case "" in
                http://http://*|https://https://*|http://https://*|https://http://*)
                  echo "error: MAS_BASE_URL is malformed ()" >&2
                  exit 1
                  ;;
              esac

              profile_id="${MAS_PROFILE_ID:-}"
              if [ -z "" ]; then
                echo "error: MAS_PROFILE_ID is required" >&2
                exit 1
              fi

              base="${MAS_BASE_URL%/}"
              auth_root="${base%/scim/v2}"
              auth_url="/v1/authenticate"
              profiles_url="/Profiles"
              profile_url="/"

              curl_args="-sS"
              if [ "${MAS_INSECURE_SKIP_VERIFY:-false}" = "true" ]; then
                curl_args=" -k"
              fi
              if [ -n "${MAS_CA_FILE:-}" ]; then
                curl_args=" --cacert "
              fi

              token="${MAS_TOKEN:-}"
              auth_type="${MAS_AUTH_TYPE:-jwt}"
              if [ -z "" ]; then
                if [ -z "${MAS_API_TOKEN_NAME:-}" ] || [ -z "${MAS_API_TOKEN_VALUE:-}" ]; then
                  echo "error: set MAS_TOKEN or MAS_API_TOKEN_NAME/VALUE" >&2
                  exit 1
                fi
                resp="$(curl  -u ":" "")"
                token="$(printf '%s' "" | tr -d '\r\n' | sed 's/.*"token"[[:space:]]*:[[:space:]]*"//; s/".*//')"
                case "" in
                  *.*.*) ;;
                  *)
                    echo "error: failed to parse token from MAS auth response" >&2
                    echo "response length: ${#resp}" >&2
                    exit 1
                    ;;
                esac
                auth_type="jwt"
              fi

              auth_header="Authorization: Bearer "
              if [ "" = "api-key" ]; then
                auth_header="Authorization: APIKey "
              fi

              payload="${MAS_PROFILE_BOOTSTRAP_JSON:-}"
              if [ -z "" ]; then
                workspace_id="${MAS_WORKSPACE_ID:-}"
                if [ -z "" ]; then
                  echo "error: MAS_WORKSPACE_ID is required when no JSON payload is provided" >&2
                  exit 1
                fi
                payload="$(printf '{"id":"%s","version":1,"identities":[{"type":"local"}],"entitlement":{"application":"PREMIUM","admin":"ADMIN_PREMIUM"},"workspaces":[{"id":"%s","applications":["manage"]}]}' "" "")"
              fi

              echo "Checking for existing MAS profile ..."
              status="$(curl  -o /tmp/profile.json -w "%{http_code}" -H "" "" || true)"
              if [ "" = "200" ]; then
                echo "MAS profile  already exists."
                exit 0
              fi
              if [ "" != "404" ]; then
                echo "error: unexpected status checking profile ()" >&2
                cat /tmp/profile.json >&2 || true
                exit 1
              fi

              echo "Creating MAS profile ..."
              create_status="$(curl  -o /tmp/profile-create.json -w "%{http_code}" \
                -H "" \
                -H "Content-Type: application/scim+json" \
                -X POST "" \
                -d "" || true)"

              case "" in
                200|201)
                  echo "MAS profile  created."
                  ;;
                409)
                  echo "MAS profile  already exists (conflict)."
                  ;;
                *)
                  echo "error: failed to create MAS profile ()" >&2
                  cat /tmp/profile-create.json >&2 || true
                  exit 1
                  ;;
              esac
      volumes:
        - name: ca-certs
          projected:
            sources:
              - secret:
                  name: scim-bridge-ca
                  optional: true
              - configMap:
                  name: scim-bridge-mas-ca
                  optional: true
              - configMap:
                  name: scim-bridge-ca
                  optional: true
