apiVersion: batch/v1
kind: Job
metadata:
  name: scim-bridge-keycloak-bootstrap
  namespace: iam
  labels:
    app.kubernetes.io/name: scim-bridge
    app.kubernetes.io/component: keycloak-bootstrap
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scim-bridge
        app.kubernetes.io/component: keycloak-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: keycloak-bootstrap
          image: "quay.io/lee_forster/mas-iam-keycloak:scim-bridge-v0.1.0"
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /tmp/kcadm
            - name: KC_HOST
              value: "http://mas-iam-sample:8080"
            - name: SCIM_REALM
              value: "maximo"
            - name: SCIM_CLIENT_ID
              value: "scim-admin"
            - name: SCIM_ASSIGN_MANAGED_ROLE
              value: "false"
            - name: KC_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: "mas-iam-sample-bootstrap-admin"
                  key: username
            - name: KC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "mas-iam-sample-bootstrap-admin"
                  key: password
            - name: SCIM_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: scim-bridge-secret
                  key: SCIM_BRIDGE_KEYCLOAK_CLIENT_SECRET
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              mkdir -p "/Users/leeforster/.keycloak"

              if [[ -z "" ]]; then
                echo "error: SCIM_CLIENT_SECRET is empty; populate scim-bridge-secret.SCIM_BRIDGE_KEYCLOAK_CLIENT_SECRET" >&2
                exit 1
              fi

              host_port="${KC_HOST#*://}"
              if [[ "" == "" ]]; then
                host_port=""
              fi
              host_port="${host_port%%/*}"
              host="${host_port%%:*}"
              port="${host_port##*:}"
              if [[ "" == "" ]]; then
                port="8080"
              fi

              echo "Waiting for Keycloak service :..."
              until (echo >"/dev/tcp//") >/dev/null 2>&1; do
                sleep 5
              done

              echo "Waiting for Keycloak admin API..."
              until /opt/keycloak/bin/kcadm.sh config credentials \
                --server "" \
                --realm master \
                --user "" \
                --password "" >/dev/null 2>&1; do
                sleep 5
              done

              for role in scim-access scim-managed; do
                /opt/keycloak/bin/kcadm.sh create roles -r "" -s "name=" >/dev/null 2>&1 || true
              done

              client_uuid="$(
                /opt/keycloak/bin/kcadm.sh get clients -r "" --fields clientId,id --format csv --noquotes 2>/dev/null \
                  | tr -d '\r' \
                  | { grep -F "," || true; } \
                  | cut -d, -f2 \
                  | head -n1
              )"

              if [[ -z "" ]]; then
                /opt/keycloak/bin/kcadm.sh create clients -r "" \
                  -s "clientId=" \
                  -s enabled=true \
                  -s protocol=openid-connect \
                  -s serviceAccountsEnabled=true \
                  -s publicClient=false \
                  -s standardFlowEnabled=false \
                  -s directAccessGrantsEnabled=false \
                  -s "secret=" >/dev/null
                client_uuid="$(
                  /opt/keycloak/bin/kcadm.sh get clients -r "" --fields clientId,id --format csv --noquotes 2>/dev/null \
                    | tr -d '\r' \
                    | { grep -F "," || true; } \
                    | cut -d, -f2 \
                    | head -n1
                )"
              else
                /opt/keycloak/bin/kcadm.sh update "clients/" -r "" \
                  -s enabled=true \
                  -s protocol=openid-connect \
                  -s serviceAccountsEnabled=true \
                  -s publicClient=false \
                  -s standardFlowEnabled=false \
                  -s directAccessGrantsEnabled=false \
                  -s "secret=" >/dev/null
              fi

              if [[ -z "" ]]; then
                echo "error: failed to resolve Keycloak client UUID after create/update" >&2
                exit 1
              fi

              sa_id=""
              for _ in {1..30}; do
                sa_id="$(
                  /opt/keycloak/bin/kcadm.sh get users -r "" -q "username=service-account-" \
                    --fields id --format csv --noquotes 2>/dev/null \
                    | tr -d '\r' \
                    | head -n1
                )"
                [[ -n "" ]] && break
                sleep 2
              done

              if [[ -z "" ]]; then
                echo "error: failed to resolve service account user ID for " >&2
                /opt/keycloak/bin/kcadm.sh get users -r "" -q "username=service-account-" || true
                exit 1
              fi

              /opt/keycloak/bin/kcadm.sh add-roles -r "" \
                --uid "" \
                --rolename scim-access >/dev/null 2>&1 || true

              if [[ "" == "true" ]]; then
                /opt/keycloak/bin/kcadm.sh add-roles -r "" \
                  --uid "" \
                  --rolename scim-managed >/dev/null 2>&1 || true
              fi

              for role in view-users query-users query-groups; do
                /opt/keycloak/bin/kcadm.sh add-roles -r "" \
                  --uid "" \
                  --cclientid realm-management \
                  --rolename "" >/dev/null 2>&1 || true
              done

