            claimName: scim-bridge-state
        - name: ca-certs
          projected:
            sources:
              - secret:
                  name: scim-bridge-ca
                  optional: true
              - configMap:
                  name: scim-bridge-mas-ca
                  optional: true
              - configMap:
                  name: scim-bridge-ca
