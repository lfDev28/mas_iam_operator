kind: Role
metadata:
  name: scim-bridge-route-cert
  namespace: mas-est
  labels:
    app.kubernetes.io/name: scim-bridge
    app.kubernetes.io/component: keycloak-route-cert
rules:
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - "scim-bridge-ca"
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scim-bridge-route-cert
  namespace: mas-est
  labels:
    app.kubernetes.io/name: scim-bridge
    app.kubernetes.io/component: keycloak-route-cert
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scim-bridge-route-cert
subjects:
  - kind: ServiceAccount
    name: scim-bridge-route-cert
    namespace: mas-est
---
apiVersion: batch/v1
kind: Job
metadata:
  name: scim-bridge-keycloak-route-cert
  namespace: mas-est
  labels:
    app.kubernetes.io/name: scim-bridge
    app.kubernetes.io/component: keycloak-route-cert
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scim-bridge
        app.kubernetes.io/component: keycloak-route-cert
    spec:
      restartPolicy: OnFailure
      serviceAccountName: scim-bridge-route-cert
      containers:
        - name: route-cert
          image: "image-registry.openshift-image-registry.svc:5000/openshift/cli:latest"
          imagePullPolicy: IfNotPresent
          env:
            - name: SCIM_BRIDGE_KEYCLOAK_ROUTE_NAMESPACE
              value: "mas-est"
            - name: SCIM_BRIDGE_KEYCLOAK_ROUTE_NAME
              value: "scim-bridge-keycloak"
            - name: SCIM_BRIDGE_KEYCLOAK_ROUTE_CERT_DAYS
              value: "825"
            - name: SCIM_BRIDGE_KEYCLOAK_ROUTE_SERVICE
              value: "mas-est-iam"
            - name: SCIM_BRIDGE_NAMESPACE
              value: "mas-est"
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail

              route_namespace="mas-est"
              route_name="scim-bridge-keycloak"
              bridge_namespace="mas-est"
              cert_days="825"
              route_service="mas-est-iam"

              if [[ -z "${route_namespace}" || -z "${route_name}" ]]; then
                echo "error: route namespace/name is required" >&2
                exit 1
              fi

              if [[ -z "${route_service}" ]]; then
                echo "error: SCIM_BRIDGE_KEYCLOAK_ROUTE_SERVICE is required" >&2
                exit 1
              fi

              workdir="$(mktemp -d)"
              cleanup() { rm -rf "${workdir}"; }
              trap cleanup EXIT

              {
                echo "apiVersion: route.openshift.io/v1"
                echo "kind: Route"
                echo "metadata:"
                echo "  name: ${route_name}"
                echo "  namespace: ${route_namespace}"
                echo "spec:"
                echo "  to:"
                echo "    kind: Service"
                echo "    name: ${route_service}"
                echo "  port:"
                echo "    targetPort: http"
                echo "  tls:"
                echo "    termination: edge"
                echo "    insecureEdgeTerminationPolicy: Redirect"
              } >"${workdir}/route.yaml"

              oc delete route -n "${route_namespace}" "${route_name}" --ignore-not-found >/dev/null 2>&1 || true
              oc apply -f "${workdir}/route.yaml"

              route_host="$(oc get route -n "${route_namespace}" "${route_name}" -o jsonpath='{.spec.host}' 2>/dev/null || true)"
              if [[ -z "${route_host}" ]]; then
                echo "error: failed to resolve generated host for route ${route_name}" >&2
                exit 1
              fi

              cert_chain="${workdir}/route-chain.crt"
              for _ in {1..30}; do
                echo | openssl s_client -showcerts -servername "${route_host}" -connect "${route_host}:443" 2>/dev/null \
                  | sed -n '/BEGIN CERTIFICATE/,/END CERTIFICATE/p' >"${cert_chain}" || true
                if grep -q "BEGIN CERTIFICATE" "${cert_chain}"; then
                  break
                fi
                sleep 5
              done

              if ! grep -q "BEGIN CERTIFICATE" "${cert_chain}"; then
                echo "error: failed to fetch route certificate chain for ${route_host}" >&2
                exit 1
              fi

              bundle_source="/etc/pki/tls/certs/ca-bundle.crt"
              if [[ -f "${bundle_source}" ]]; then
                cat "${bundle_source}" "${cert_chain}" >"${workdir}/ca-bundle.crt"
              else
                cp "${cert_chain}" "${workdir}/ca-bundle.crt"
              fi

              oc create secret generic scim-bridge-ca \
                -n "${bridge_namespace}" \
                --from-file=keycloak-ca.crt="${cert_chain}" \
                --from-file=ca-bundle.crt="${workdir}/ca-bundle.crt" \
                --dry-run=client -o yaml | oc apply --server-side -f -

---
apiVersion: batch/v1
kind: Job
metadata:
  name: scim-bridge-mas-profile-bootstrap
  namespace: mas-est
  labels:
    app.kubernetes.io/name: scim-bridge
    app.kubernetes.io/component: mas-profile-bootstrap
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scim-bridge
        app.kubernetes.io/component: mas-profile-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mas-profile-bootstrap
          image: "quay.io/curl/curl:8.5.0"
          imagePullPolicy: IfNotPresent
          env:
            - name: MAS_PROFILE_BOOTSTRAP_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: scim-bridge-config
                  key: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_ENABLED
            - name: MAS_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: scim-bridge-config
                  key: SCIM_BRIDGE_MAS_BASE_URL
            - name: MAS_PROFILE_ID
              valueFrom:
                configMapKeyRef:
                  name: scim-bridge-config
                  key: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_ID
            - name: MAS_WORKSPACE_ID
              valueFrom:
                configMapKeyRef:
                  name: scim-bridge-config
                  key: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_WORKSPACE_ID
            - name: MAS_PROFILE_BOOTSTRAP_JSON
              valueFrom:
                configMapKeyRef:
                  name: scim-bridge-config
                  key: SCIM_BRIDGE_MAS_PROFILE_BOOTSTRAP_JSON
            - name: MAS_INSECURE_SKIP_VERIFY
              valueFrom:
                configMapKeyRef:
                  name: scim-bridge-config
                  key: SCIM_BRIDGE_MAS_INSECURE_SKIP_VERIFY
            - name: MAS_CA_FILE
              valueFrom:
                configMapKeyRef:
                  name: scim-bridge-config
                  key: SCIM_BRIDGE_MAS_CA_FILE
            - name: MAS_AUTH_TYPE
              valueFrom:
                configMapKeyRef:
                  name: scim-bridge-config
                  key: SCIM_BRIDGE_MAS_AUTH_TYPE
            - name: MAS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: scim-bridge-secret
                  key: SCIM_BRIDGE_MAS_TOKEN
            - name: MAS_API_TOKEN_NAME
              valueFrom:
                secretKeyRef:
                  name: scim-bridge-secret
                  key: SCIM_BRIDGE_MAS_API_TOKEN_NAME
            - name: MAS_API_TOKEN_VALUE
              valueFrom:
                secretKeyRef:
                  name: scim-bridge-secret
                  key: SCIM_BRIDGE_MAS_API_TOKEN_VALUE
          volumeMounts:
            - name: ca-certs
              mountPath: /etc/scim-bridge/certs
              readOnly: true
          command:
            - /bin/sh
            - -ec
            - |
              set -eu

              if [ "${MAS_PROFILE_BOOTSTRAP_ENABLED:-false}" != "true" ]; then
                echo "MAS profile bootstrap disabled; skipping."
                exit 0
              fi

              if [ -z "${MAS_BASE_URL:-}" ]; then
                echo "error: MAS_BASE_URL is required" >&2
                exit 1
              fi
              case "${MAS_BASE_URL}" in
                http://http://*|https://https://*|http://https://*|https://http://*)
                  echo "error: MAS_BASE_URL is malformed (${MAS_BASE_URL})" >&2
                  exit 1
                  ;;
              esac

              profile_id="${MAS_PROFILE_ID:-}"
              if [ -z "${profile_id}" ]; then
                echo "error: MAS_PROFILE_ID is required" >&2
                exit 1
              fi

              base="${MAS_BASE_URL%/}"
              auth_root="${base%/scim/v2}"
              auth_url="${auth_root}/v1/authenticate"
              profiles_url="${base}/Profiles"
              profile_url="${profiles_url}/${profile_id}"

              curl_args="-sS"
              if [ "${MAS_INSECURE_SKIP_VERIFY:-false}" = "true" ]; then
                curl_args="${curl_args} -k"
              fi
              if [ -n "${MAS_CA_FILE:-}" ]; then
                curl_args="${curl_args} --cacert ${MAS_CA_FILE}"
              fi

              token="${MAS_TOKEN:-}"
              auth_type="${MAS_AUTH_TYPE:-jwt}"
              if [ -z "${token}" ]; then
                if [ -z "${MAS_API_TOKEN_NAME:-}" ] || [ -z "${MAS_API_TOKEN_VALUE:-}" ]; then
                  echo "error: set MAS_TOKEN or MAS_API_TOKEN_NAME/VALUE" >&2
                  exit 1
                fi
                resp="$(curl ${curl_args} -u "${MAS_API_TOKEN_NAME}:${MAS_API_TOKEN_VALUE}" "${auth_url}")"
                token="$(printf '%s' "${resp}" | tr -d '\r\n' | sed 's/.*"token"[[:space:]]*:[[:space:]]*"//; s/".*//')"
                case "${token}" in
                  *.*.*) ;;
                  *)
                    echo "error: failed to parse token from MAS auth response" >&2
                    echo "response length: ${#resp}" >&2
                    exit 1
                    ;;
                esac
                auth_type="jwt"
              fi

              auth_header="Authorization: Bearer ${token}"
              if [ "${auth_type}" = "api-key" ]; then
                auth_header="Authorization: APIKey ${token}"
              fi

              payload="${MAS_PROFILE_BOOTSTRAP_JSON:-}"
              if [ -z "${payload}" ]; then
                workspace_id="${MAS_WORKSPACE_ID:-}"
                if [ -z "${workspace_id}" ]; then
                  echo "error: MAS_WORKSPACE_ID is required when no JSON payload is provided" >&2
                  exit 1
                fi
                payload="$(printf '{"id":"%s","version":1,"identities":[{"type":"local"}],"entitlement":{"application":"PREMIUM","admin":"ADMIN_PREMIUM"},"workspaces":[{"id":"%s","applications":["manage"]}]}' "${profile_id}" "${workspace_id}")"
              fi

              echo "Checking for existing MAS profile ${profile_id}..."
              status="$(curl ${curl_args} -o /tmp/profile.json -w "%{http_code}" -H "${auth_header}" "${profile_url}" || true)"
              if [ "${status}" = "200" ]; then
                echo "MAS profile ${profile_id} already exists."
                exit 0
              fi
              if [ "${status}" != "404" ]; then
                echo "error: unexpected status checking profile (${status})" >&2
                cat /tmp/profile.json >&2 || true
                exit 1
              fi

              echo "Creating MAS profile ${profile_id}..."
              create_status="$(curl ${curl_args} -o /tmp/profile-create.json -w "%{http_code}" \
                -H "${auth_header}" \
                -H "Content-Type: application/scim+json" \
                -X POST "${profiles_url}" \
                -d "${payload}" || true)"

              case "${create_status}" in
                200|201)
                  echo "MAS profile ${profile_id} created."
                  ;;
                409)
                  echo "MAS profile ${profile_id} already exists (conflict)."
                  ;;
                *)
                  echo "error: failed to create MAS profile (${create_status})" >&2
                  cat /tmp/profile-create.json >&2 || true
                  exit 1
                  ;;
              esac
      volumes:
        - name: ca-certs
          projected:
            sources:
              - secret:
                  name: scim-bridge-ca
                  optional: true
              - configMap:
                  name: scim-bridge-mas-ca
                  optional: true
              - configMap:
