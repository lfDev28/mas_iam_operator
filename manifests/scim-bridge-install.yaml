apiVersion: batch/v1
kind: Job
metadata:
  name: scim-bridge-keycloak-route-cert
  namespace: iam
  labels:
    app.kubernetes.io/name: scim-bridge
    app.kubernetes.io/component: keycloak-route-cert
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scim-bridge
        app.kubernetes.io/component: keycloak-route-cert
    spec:
      restartPolicy: OnFailure
      serviceAccountName: scim-bridge-route-cert
      containers:
        - name: route-cert
          image: "registry.redhat.io/openshift4/ose-cli"
          imagePullPolicy: IfNotPresent
          env:
            - name: SCIM_BRIDGE_KEYCLOAK_ROUTE_NAMESPACE
              value: "iam"
            - name: SCIM_BRIDGE_KEYCLOAK_ROUTE_NAME
              value: "scim-bridge-keycloak"
            - name: SCIM_BRIDGE_KEYCLOAK_ROUTE_CERT_DAYS
              value: "825"
            - name: SCIM_BRIDGE_KEYCLOAK_ROUTE_SERVICE
              value: "mas-iam-sample"
            - name: SCIM_BRIDGE_NAMESPACE
              value: "iam"
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail

              route_namespace="iam"
              route_name="scim-bridge-keycloak"
              bridge_namespace="iam"
              cert_days="825"
              route_service="mas-iam-sample"

              if [[ -z "" || -z "" ]]; then
                echo "error: route namespace/name is required" >&2
                exit 1
              fi

              if [[ -z "" ]]; then
                echo "error: SCIM_BRIDGE_KEYCLOAK_ROUTE_SERVICE is required" >&2
                exit 1
              fi

              workdir="$(mktemp -d)"
              cleanup() { rm -rf ""; }
              trap cleanup EXIT

              {
                echo "apiVersion: route.openshift.io/v1"
                echo "kind: Route"
                echo "metadata:"
                echo "  name: "
                echo "  namespace: "
                echo "spec:"
                echo "  to:"
                echo "    kind: Service"
                echo "    name: "
                echo "  port:"
                echo "    targetPort: http"
                echo "  tls:"
                echo "    termination: edge"
                echo "    insecureEdgeTerminationPolicy: Redirect"
              } >"/route.yaml"

              oc delete route -n "" "" --ignore-not-found >/dev/null 2>&1 || true
              oc apply -f "/route.yaml"

              route_host="$(oc get route -n "" "" -o jsonpath='{.spec.host}' 2>/dev/null || true)"
              if [[ -z "" ]]; then
                echo "error: failed to resolve generated host for route " >&2
                exit 1
              fi

              cert_chain="/route-chain.crt"
              for _ in {1..30}; do
                echo | openssl s_client -showcerts -servername "" -connect ":443" 2>/dev/null \
                  | sed -n '/BEGIN CERTIFICATE/,/END CERTIFICATE/p' >"" || true
                if grep -q "BEGIN CERTIFICATE" ""; then
                  break
                fi
                sleep 5
              done

              if ! grep -q "BEGIN CERTIFICATE" ""; then
                echo "error: failed to fetch route certificate chain for " >&2
                exit 1
              fi

              bundle_source="/etc/pki/tls/certs/ca-bundle.crt"
              if [[ -f "" ]]; then
                cat "" "" >"/ca-bundle.crt"
              else
                cp "" "/ca-bundle.crt"
              fi

              oc create secret generic scim-bridge-ca \
                -n "" \
                --from-file=keycloak-ca.crt="" \
                --from-file=ca-bundle.crt="/ca-bundle.crt" \
                --dry-run=client -o yaml | oc apply --server-side -f -

