apiVersion: v1
kind: ConfigMap
metadata:
  name: scim-bridge-tools
  namespace: iam
data:
  retry-errors.py: |
    #!/usr/bin/env python3
    #
    # Clear "sticky" error entries in the SCIM bridge state file so the bridge will retry.
    #
    # This edits the PVC-backed state file. The bridge should be restarted after changes so it
    # reloads state from disk and doesn't overwrite your edits with in-memory state.
    #
    # Usage:
    #   /opt/scim-bridge-tools/retry-errors --list
    #   /opt/scim-bridge-tools/retry-errors --all-errors
    #   /opt/scim-bridge-tools/retry-errors --username jane.doe
    #
    import argparse
    import datetime
    import json
    import os
    import shutil
    import sys
    from pathlib import Path


    def load_state(path: Path) -> dict:
      if not path.exists():
        return {}
      raw = path.read_text()
      if not raw.strip():
        return {}
      try:
        return json.loads(raw)
      except json.JSONDecodeError as e:
        print(f"error: failed to parse JSON in {path}: {e}", file=sys.stderr)
        sys.exit(2)


    def iter_error_entries(state: dict):
      for key, entry in state.items():
        if isinstance(entry, dict) and entry.get("status") == "error":
          yield key, entry


    def write_state(path: Path, state: dict, *, dry_run: bool) -> None:
      rendered = json.dumps(state, indent=2, sort_keys=True) + "\n"
      if dry_run:
        print(f"dry-run: would write {path} ({len(rendered)} bytes)")
        return

      mode = 0o600
      if path.exists():
        mode = path.stat().st_mode & 0o777
        ts = datetime.datetime.utcnow().strftime("%Y%m%dT%H%M%SZ")
        bak = path.with_name(path.name + f".bak.{ts}")
        shutil.copy2(path, bak)
        print(f"backup: {bak}")

      tmp = path.with_name(path.name + ".tmp")
      tmp.write_text(rendered)
      os.replace(tmp, path)
      os.chmod(path, mode)


    def select_keys(state: dict, *, ids: list, usernames: list, all_errors: bool) -> list:
      keys = set()
      if ids:
        for i in ids:
          if i in state:
            keys.add(i)
      if usernames:
        wanted = set(usernames)
        for k, entry in state.items():
          if isinstance(entry, dict) and entry.get("username") in wanted:
            keys.add(k)
      if all_errors:
        for k, _ in iter_error_entries(state):
          keys.add(k)
      return sorted(keys)


    def main() -> None:
      parser = argparse.ArgumentParser(
        description="Retry/clear sticky SCIM bridge state errors by editing the state.json file."
      )
      parser.add_argument(
        "--state-path",
        default=os.environ.get("SCIM_BRIDGE_STATE_PATH", "/var/lib/scim-bridge/state.json"),
        help="Path to the state JSON file (default: /var/lib/scim-bridge/state.json).",
      )
      parser.add_argument("--list", action="store_true", help="List current error entries and exit.")
      parser.add_argument("--all-errors", action="store_true", help="Target all entries with status=error.")
      parser.add_argument("--id", action="append", default=[], help="Target a specific Keycloak user ID (UUID).")
      parser.add_argument("--username", action="append", default=[], help="Target a username (repeatable).")
      parser.add_argument(
        "--mode",
        choices=["delete", "reset"],
        default="delete",
        help="delete removes entries; reset clears lastError and sets status=ok (keeps entry).",
      )
      parser.add_argument("--dry-run", action="store_true", help="Show what would change without writing.")
      args = parser.parse_args()

      state_path = Path(args.state_path)
      state = load_state(state_path)

      if args.list:
        errors = list(iter_error_entries(state))
        if not errors:
          print("no errors found")
          return
        for key, entry in errors:
          username = entry.get("username", "")
          mas_id = entry.get("masID", "")
          last_error = entry.get("lastError", "")
          print(f"{key}\tusername={username}\tmasID={mas_id}\tlastError={last_error}")
        return

      if not (args.all_errors or args.id or args.username):
        print("error: specify --all-errors, --id, or --username (or use --list)", file=sys.stderr)
        sys.exit(2)

      keys = select_keys(state, ids=args.id, usernames=args.username, all_errors=args.all_errors)
      if not keys:
        print("no matching entries found")
        return

      would_change = 0
      for key in keys:
        entry = state.get(key)
        if args.mode == "delete":
          if not args.dry_run:
            state.pop(key, None)
          would_change += 1
        else:
          if isinstance(entry, dict):
            if not args.dry_run:
              entry.pop("lastError", None)
              entry["status"] = "ok"
            would_change += 1

      print(f"matched={len(keys)} changed={would_change} mode={args.mode} dry_run={args.dry_run}")
      write_state(state_path, state, dry_run=args.dry_run)
      if args.dry_run:
        return
      print("next: restart the bridge so it reloads state from disk")
      print("  oc rollout restart deployment/scim-bridge -n <namespace>")


    if __name__ == "__main__":
      main()
  retry-errors: |
    #!/usr/bin/env sh
    set -eu
    export PYTHONDONTWRITEBYTECODE=1
    exec python3 /opt/scim-bridge-tools/retry-errors.py "$@"
