# Apply this manifest to install the MAS EST IAM operator via OLM.
# Sample MasIamStack + dev TLS bootstrap live in manifests/install-olm-sample.yaml.
# Replace every occurrence of `mas-est` if you want to target a different namespace.
# OpenShift: the operator now grants the Keycloak/OpenLDAP service accounts the
# `system:openshift:scc:anyuid` SCC automatically, so manual `oc adm policy` steps
# are no longer required.
# The RoleBinding below mirrors `oc adm policy add-role-to-user admin -z mas-iam-operator-controller-manager -n mas-est`
# so the operator service account always has permission to manage RoleBindings during reconciliation.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: masiamstacks.iam.mas.ibm.com
spec:
  group: iam.mas.ibm.com
  names:
    kind: MasIamStack
    listKind: MasIamStackList
    plural: masiamstacks
    singular: masiamstack
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MasIamStack is the Schema for the masiamstacks API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of MasIamStack
            type: object
            x-kubernetes-preserve-unknown-fields: true
          status:
            description: Status defines the observed state of MasIamStack
            type: object
            x-kubernetes-preserve-unknown-fields: true
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mas-iam-operator-controller-manager-admin
  namespace: mas-est
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
- kind: ServiceAccount
  name: mas-iam-operator-controller-manager
  namespace: mas-est
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mas-iam-operator-controller-manager-anyuid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
- kind: ServiceAccount
  name: mas-iam-operator-controller-manager
  namespace: mas-est
---
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: mas-iam-operator
  namespace: openshift-marketplace
spec:
  displayName: MAS EST IAM Operator
  image: quay.io/lee_forster/mas-iam-operator:catalog-0.0.12
  sourceType: grpc
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: mas-est-operator-group
  namespace: mas-est
spec:
  targetNamespaces:
  - mas-est
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: mas-iam-operator
  namespace: mas-est
spec:
  channel: alpha
  installPlanApproval: Automatic
  name: mas-iam-operator
  source: mas-iam-operator
  sourceNamespace: openshift-marketplace
